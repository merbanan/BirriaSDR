                  raise TimeoutError('Digital reference ready did not assert')
          dev.rmw(1879048448, 1008, 0)
          dev.rmw(1879048456, 0, 32)
          dev.rmw(1879048456, 50331648, 16777216)
          dev.rmw(1879048520, 0, 1)
          dev.rmw(1879060480, 0, 8)
          dev.rmw(1879048520, 16, 0)
          switched_reference = bool(dev.rr(1879117972) & 4)
          if switched_reference:
              spi.update(5, 2816, set_=65536)
              time.sleep(2e-05)
          dev.rmw(1879060500, 0, 32768)
          for bit in (32768, 2048, 8):
              dev.rmw(1879068672, 0, bit)
          strap = dev.rr(1879113740)
          dev.rmw(1879068684, 57344, 24576 if strap & 1 << 13 else 16384)
          dev.rmw(1879068684, 14, 6 if strap & 1 << 14 else 4)
          dev.rmw(1879068680, 3584, 1536 if strap & 1 << 10 else 1024)
          report['digital_after'] = {hex(a): hex(dev.rr(a)) for a in clock_regs}
          spi.update(5, 2820, 61440, 28672)
          spi.update(5, 2720, 805306368, 536870912)
          time.sleep(2e-05)
          spi.update(5, 2820, 61440)
          spi.update(5, 2720, 2147483648)
          for address in (776, 1068):
              spi.update(5, address, 1023, 9)
          for address in (768, 1060):
              spi.update(5, address, 67043328, 524288)
          spi.update(5, 12, 805306368)
          for address in (1879064832, 1879064848):
              dev.rmw(address, 8, 0)
          spi.update(5, 12, 3221225472)
          if switched_reference:
              spi.update(5, 2816, 65536)
              time.sleep(2e-05)
