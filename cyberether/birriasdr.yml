version: 2
title: BirriaSDR proof of concept (experimental)
summary: Rough proof-of-concept I/Q stream using the original BirriaSDR firmware.
author: Luigi C.
license: MIT
description: No vendor firmware downloads. Single 40 MSps complex output. Cold channel 6 reception verified on the tested COMFAST dongle and Raspberry Pi 5.
graph:
- name: instructions
  module: note
  device: cpu
  runtime: native
  provider: generic
  config:
    content: |
      # BirriaSDR in CyberEther

      **This flowgraph is a very rough proof of concept.** It lets you quickly test the dongle and watch a live spectrum without building anything. Expect rough edges and runs that stop on an overrun. For real use, build the C library from the BirriaSDR repository.

      ## Before you start

      You need a Python 3.11 or newer runtime and the COMFAST dongle (USB ID `3574:6211`) on a USB 3.0 port. Boards with MediaTek's generic ID `0e8d:7961` are also accepted, but this flowgraph has not been validated on them. Select the interpreter under **Settings → Runtime → Python Runtime** and restart CyberEther. Make sure no other program is using the dongle.

      The dongle needs a clean start, which depends on your computer:

      - **Raspberry Pi 5:** The receiver handles it by power-cycling the USB ports and keeping the Wi-Fi driver away from the dongle. This needs root, and it only runs when the dongle is the only USB device connected.
      - **Other Linux computers:** Stop the Wi-Fi driver from binding to the dongle, then plug it in fresh. The receiver runs its USB worker with `sudo -n` unless CyberEther already runs as root, so allow that without a password prompt. If you have direct USB permissions, set `USE_SUDO = False` and `COLD_PI5 = False` instead.
      - **macOS:** Reconnect the dongle if another driver loaded firmware onto it. This setup has not been tested on macOS hardware.

      ## Run

      Open this flowgraph and let CyberEther install NumPy, PyUSB and libusb-package. The first install needs internet access. The receiver then tunes to channel 6 (nominally 2437 MHz) at 40 MSps and feeds the spectrum and waterfall directly. Close the flowgraph to stop capture and release the dongle. If anything goes wrong, open the receiver block's **Console**.

      ## Gain

      The gain settings sit near the top of the receiver code. Change them and reload the block, which starts a new capture.

      | Setting | Default | Values |
      | --- | --- | --- |
      | `GAIN_MODE` | `'automatic'` | `'automatic'` or `'manual'` |
      | `LNA_GAIN` | `1` | 0 to 3 |
      | `LPF_GAIN` | `4` | 0 to 8 |
      | `DIGITAL_GAIN` | `0` | 0 to 12 |

      The three gain codes only apply in manual mode and are not calibrated in dB.

      ## Good to know

      - Nothing is flashed and no vendor firmware is downloaded. Our small device program runs in RAM and disappears when the dongle loses power.
      - If startup reports a retained vendor patch, unplug the dongle and repeat the clean start.
      - A NumPy error that mentions two Python versions means the interpreters do not match. Select Python 3.11 or newer, keep `PYTHON = None` in the receiver code and restart CyberEther.
      - The edges of the 40 MHz span roll off, because this receiver still uses a 20 MHz analog filter.
