                  raise RuntimeError('Receive reference remained in standby')
          report['receive_reference_control'] = hex(spi.read(5, 2816))
          report['top_after'] = {hex(a): hex(spi.read(5, a)) for a in addresses}
          configure_chain_bias(spi, 1)
          report['rf_before_tune'] = {hex(a): hex(spi.read(1, a)) for a in (0, 112, 120, 3084, 3268, 3272, 3360, 3448, 3452)}
          spi.update(1, 3128, set_=3)
          spi.update(1, 1308, 786432, 262144)

          def chain_state():
              return {str(p): {hex(a): hex(spi.read(p, a)) for a in (484, 488, 516, 540)} for p in (1, 0)}
          report['chain_before'] = chain_state()
          for port in (1, 0):
              spi.write(port, 484, 9153)
              spi.update(port, 488, set_=2147483648)
