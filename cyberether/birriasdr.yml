          path.write_bytes(_script_text.encode() if isinstance(_script_text, str) else _script_text)
          return path


      def ring_directory():
          # Keep the Linux I/Q ring off the SD card: dirty-file writeback stalls USB.
          shared = Path('/dev/shm')
          if sys.platform.startswith('linux') and shared.is_dir():
              space = os.statvfs(shared)
              if space.f_bavail * space.f_frsize < 40 * 1024 * 1024:
