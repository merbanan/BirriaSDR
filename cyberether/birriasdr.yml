      CHAIN_SPI_PORT = (1, 0)

      def select_capture_chain(dev, chain):
          """Choose ICAP chain 0/1; this does not switch an external antenna."""
          if type(chain) is not int or chain not in (0, 1):
              raise ValueError('Expected capture chain 0 or 1')
          dev.rmw(2198525000, 3840, 4 + chain << 8)
          actual = dev.rr(2198525000)
          if actual >> 8 & 15 != 4 + chain:
              raise RuntimeError('ICAP receive-chain selection did not read back')
          return dict(capture_chain=chain, rf_spi_port=CHAIN_SPI_PORT[chain])

      PHY_MASKS = {196: 4160222983, 264: 1061093376, 336: 2154885120}

      RF_MASK = 4286578688

      def decode_active_gain(word):
          """Observed RF 0x268 index mirrors, not calibrated gain in dB.

          Matched LNA 0..3 and LPF 0/4/8 in reference tests. Other bits are undecoded;
          a stable pair does not prove that every internal gain loop has stopped.
          """
          return dict(lna=word >> 21 & 7, lpf=word >> 17 & 15)

      class GainControl:
          """Save an unforced baseline, apply fixed indices, then restore it.

          Construct once after receiver/channel setup, before changing gain. Recreate
          after retuning or resetting; do not reuse a baseline from a previous boot.
          Chain 0 is measured; chain 1 has the same register layout but is untested.
          """

          def __init__(self, dev, spi, chain=0):
              if type(chain) is not int or chain not in (0, 1):
                  raise ValueError('Expected receive chain 0 or 1')
              self.dev, self.spi, self.chain = (dev, spi, chain)
              self.base, self.port = (2197815296 + (chain << 16), CHAIN_SPI_PORT[chain])
              self.baseline = self._snapshot()
              if self.baseline[196] & 7 or self.baseline[336] & 1 << 31 or self.baseline[1896] & 1 << 31 or dev.rr(self.base + 208) & 1 << 27:
                  raise RuntimeError('Gain forces already active; restore receiver setup before saving an AGC baseline')

          def _snapshot(self):
              return {**{off: self.dev.rr(self.base + off) for off in PHY_MASKS}, 1896: self.spi.read(self.port, 1896)}

          def _write(self, off, value):
              if off == 1896:
                  old = self.spi.read(self.port, off)
                  word = old & ~RF_MASK | value & RF_MASK
                  self.spi.write(self.port, off, word)
                  actual = self.spi.read(self.port, off)
                  mask = RF_MASK
              else:
                  mask = PHY_MASKS[off]
                  old = self.dev.rr(self.base + off)
                  word = old & ~mask | value & mask
                  self.dev.wr(self.base + off, word)
                  actual = self.dev.rr(self.base + off)
              if (actual ^ word) & mask:
                  raise RuntimeError(f'Gain field readback mismatch at {off:#x}')

          def _apply(self, values, manual):
              before = self._snapshot()
              order = (1896, 264, 336, 196) if manual else (264, 336, 196, 1896)
              try:
                  for off in order:
                      self._write(off, values[off])
                  return self.status()
              except Exception as cause:
                  failures = []
                  for off in (264, 336, 196, 1896):
                      try:
                          self._write(off, before[off])
                      except Exception as exc:
                          failures.append(str(exc))
                  detail = '; rollback failed: ' + '; '.join(failures) if failures else '; previous gain fields restored'
                  raise RuntimeError(str(cause) + detail) from cause

          def manual(self, lna, lpf, digital=0):
              """Hold raw LNA/LPF indices and digital gain; inputs are not RF dB.

              Conservative tested ranges, not every combination measured. Digital
              codes 6 and 12 gave approximately +6 and +12 dB amplitude on the stock
              reference capture path. This does not establish ADC resolution/ENOB.
              """
              if any((type(v) is not int or not 0 <= v <= limit for v, limit in ((lna, 3), (lpf, 8), (digital, 12)))):
                  raise ValueError('Experimental gain ranges: LNA=0..3, LPF=0..8, digital=0..12')
              gain = 7 | sum((lna << a | lpf << b for a, b in ((8, 12), (16, 20), (24, 28))))
              return self._apply({196: gain, 264: digital << 24 | digital << 16, 336: 1 << 31 | lna << 20, 1896: 1 << 31 | lna << 27 | lpf << 23}, True)

          def automatic(self):
              """Restore saved unforced fields; requires an already initialized AGC.

              On our incomplete cold receiver this only releases the overrides.
              It cannot promise functioning automatic gain or restore firmware state.
              """
              return self._apply(self.baseline, False)

          def status(self):
              words = self._snapshot()
              active = self.spi.read(self.port, 616)
              return dict(chain=self.chain, rf_spi_port=self.port, phy_words={hex(self.base + a): hex(words[a]) for a in PHY_MASKS}, analog_word=hex(words[1896]), active_word=hex(active), active_indices=decode_active_gain(active), phy_force_abc=words[196] & 7, phy_force_d=bool(words[336] & 1 << 31), analog_force=bool(words[1896] & 1 << 31), digital_a=words[264] >> 24 & 63, digital_c=words[264] >> 16 & 63, full_agc_control_validated=False)

      def configure_probe(dev, report, channel=6, chain=0, synth_port=0, rx_bias=False):
          if channel not in range(1, 14) or chain not in (0, 1) or synth_port not in (0, 1):
              raise ValueError('Expected channel 1..13, chain 0/1 and synth port 0/1')
          frequency_khz = 2407000 + 5000 * channel
          configure_receiver(dev, report, frequency_khz)
          spi = RFSPI(dev)
          configure_chain_bias(spi, 0)
          for address in (2198405124, 2198405128):
              dev.set_bits(address, 14400)
          for port in (0, 1):
              spi.write(port, 484, 261067)
              spi.update(port, 516, 4278190080, 1536)
              spi.update(port, 3128, set_=3)
              if rx_bias:
                  spi.update(port, 236, set_=268435456)
                  spi.write(port, 1592, 541131016)
                  spi.write(port, 1596, 135274625)
          tune_2g(spi, frequency_khz, report, port=synth_port)
          dev.rmw(2198525000, 3840, 4 + chain << 8)
          report.update(requested_channel=channel, capture_chain=chain, requested_frequency_hz=frequency_khz * 1000, frequency_hz=None, nominal_sample_rate_hz=40000000, rx_bias_experiment=rx_bias, calibrated=False, rf_reception_validated=False)
          report['synth_diagnostics'] = {str(p): {hex(a): hex(spi.read(p, a)) for a in (484, 516, 236, 1592, 1596, 3176, 3440, 3448, 3452)} for p in (0, 1)}

      def configure_rx_experiment(dev, report):
          """Repeat the previously tested, incomplete channel-6 receive setup.

          These are individually decoded register settings, not a firmware image or
          copied calibration table. Their RF function remains under investigation.
          """
          configure_probe(dev, report, 6, 0, 0, True)
          spi = RFSPI(dev)
          tune_2g(spi, 2437000, report, port=0, secondary=True)
          for p in (0, 1):
              spi.update(p, 516, 12582912, 12582912)
              spi.update(p, 540, 393216, 393216)
              spi.update(p, 3128, 3)
              spi.update(p, 576, 4026531840, 2684354560 if p == 1 else 0)
              spi.update(p, 2384, 1610612736, 536870912 if p == 1 else 1610612736)
              spi.update(p, 1308, 786432)
              spi.write(p, 484, 260875 if p == 1 else 9153)
          for addr, value in ((3156, 530456), (3168, 534024), (3176, 2263875584), (3180, 26641), (3184, 21835815), (3192, 226160)):
              spi.write(0, addr, value)
          tune_2g(spi, 2437000, report, port=0, secondary=True)
          spi.update(0, 576, 4026531840)
          for p in (0, 1):
              spi.update(p, 516, 1536)
              for addr, value in ((1852, 11190312), (1856, 39157760), (1944, 11190312), (1948, 39157760)):
                  spi.write(p, addr, value)
              spi.update(p, 352, 3221225472)
          report['capture_chain_control'] = select_capture_chain(dev, 0)
          return spi

      def configure_capture(dev, report):
          if dev.rr(MAILBOX + 76):
              raise RuntimeError('ROM PHY power-on failed')
          report['analog_chip_id'] = hex(RFSPI(dev).read(5, 44))
          if report['analog_chip_id'] != '0x79728a10':
              raise RuntimeError('Only the tested MT7972 radio is supported by this probe')
          dev.rmw(2181967872, 512, 256)
          for address in (2198339588, 2198339592):
              dev.set_bits(address, 14400)
          dev.clear_bits(2198482952, 3 << 21)
          dev.wr(2198474752, 67698944)
          dev.rmw(2198474756, 255, 16)
          dev.wr(2198474760, 0)
          dev.wr(2147618960, 241)
          dev.wr(2147618968, 0)
          dev.wr(2147618972, 65532)
          dev.rmw(2147619000, 983040, 2617245696)
          dev.rmw(2198524992, 255, 2147483667)
          dev.rmw(2198525000, 268435455, 9176064)
          dev.set_bits(2281738244, 251658240)
          dev.wr(2147618960, 1265)
          report['capture_configured'] = True

      PAYLOAD_BYTES = DMA_DEFINITIONS['PAYLOAD_BYTES']

      FRAME_BYTES = 44 + PAYLOAD_BYTES + 4

      class Validator:
          """Validate every payload byte, sequence and run nonce, across USB fragments."""
          EVENT_EXT = 244

          def __init__(self, nonce):
              self.nonce = nonce
              self.pending = bytearray()
              self.packets = 0
              self.acknowledgements = 0
              base = nonce ^ 2779054080
              self.middle = b''.join((struct.pack('<I', base + i & 4294967295) for i in range(1, PAYLOAD_BYTES // 4 - 1)))

          def feed(self, raw):
              self.pending.extend(raw)
              offset = 0
              while len(self.pending) - offset >= 4:
                  word, = struct.unpack_from('<I', self.pending, offset)
                  size = word & 65535
                  if word >> 27 != 7 or size not in (36, FRAME_BYTES - 4):
                      raise ValueError(f'Invalid USB frame header {word:#x}')
                  total = size + 4
                  if len(self.pending) - offset < total:
                      break
                  frame = memoryview(self.pending)[offset:offset + total]
                  try:
                      if size == 36:
                          if frame[28] != 1 or frame[32] != 0:
                              raise ValueError('Unexpected or failed ROM acknowledgement')
                          self.acknowledgements += 1
                      else:
                          if frame[28] != 237 or frame[32] != self.EVENT_EXT or struct.unpack_from('<I', frame, 24)[0] != 939524116 + PAYLOAD_BYTES:
                              raise ValueError('Unexpected event type/length')
                          sequence, nonce = struct.unpack_from('<II', frame, 36)
                          if sequence != self.packets or nonce != self.nonce:
                              raise ValueError(f'Packet gap/duplicate/stale run: expected {self.packets}, got {sequence}, nonce {nonce:#x}')
                          self.validate_payload(frame, sequence)
                          self.packets += 1
                  finally:
                      frame.release()
                  offset += total
              if offset:
                  del self.pending[:offset]

          def validate_payload(self, frame, sequence):
              first, = struct.unpack_from('<I', frame, 44)
              last, trailer = struct.unpack_from('<II', frame, len(frame) - 8)
              if first != sequence or last != sequence ^ 4294967295 or trailer:
                  raise ValueError(f'Payload sequence/trailer mismatch in packet {sequence}')
              if frame[48:-8].tobytes() != self.middle:
                  raise ValueError(f'Payload corruption in packet {sequence}')

          def finish(self, expected):
              if self.pending:
                  raise ValueError(f'Truncated final packet ({len(self.pending)} bytes)')
              if self.packets != expected:
                  raise ValueError(f'Expected {expected} packets, received {self.packets}')

      def mailbox(dev):
          return [dev.rr(MAILBOX + 4 * i) for i in range(16)]

      def run_stream(dev, protocol, image, manifest, report, packets, seconds, depth, backpressure_ms=0, configure=None, validator_type=Validator, stop=None):
          nonce = prepare_download(dev, protocol, image, manifest, report)
          for i, value in enumerate((packets, 0, 0, 0, 0, 0, 0, 0), 8):
              dev.wr(MAILBOX + 4 * i, value)
          report['phase'] = 'start_dma_program'
          dev.mcu_send(MCU_CMD_FW_START_REQ, struct.pack('<II', FW_START_OVERRIDE, ENTRY), wait=False)
          deadline = time.monotonic() + 3
          while dev.rr(MAILBOX) != BOOT_MAGIC and time.monotonic() < deadline:
              time.sleep(0.005)
          words = mailbox(dev)
          report['initial_mailbox'] = words
          if words[:3] != [BOOT_MAGIC, nonce, nonce ^ RESPONSE_XOR] or words[7] != 1:
              raise RuntimeError('DMA firmware did not answer the fresh challenge in ready state')
          report['custom_entry_executed'] = True
          if configure is not None:
              configure(dev, report)
          validator = validator_type(nonce)
          report['phase'] = 'streaming'
          first = last = None
          stop_requested = False
          if backpressure_ms:
              dev.wr(MAILBOX + 60, 1)
              time.sleep(backpressure_ms / 1000)
              report['backpressure_ms'] = backpressure_ms
          with PythonBulk(dev.dev, dev.ep_in_pkt_rx, depth=depth) as reader:
              start = time.monotonic()
              report['phase'] = 'bulk_reads_queued'
              if not backpressure_ms:
                  dev.wr(MAILBOX + 60, 1)
              report['phase'] = 'go_sent'
              last_progress = start
              next_status_poll = 0
              finished = None
              while True:
                  now = time.monotonic()
                  if not stop_requested and (seconds and now - start >= seconds or (stop is not None and stop.is_set())):
                      dev.wr(MAILBOX + 36, 1)
                      stop_requested = True
                  try:
                      _, raw = reader.read(0.1)
                      before = validator.packets
                      validator.feed(raw)
                      report['packets_received_so_far'] = validator.packets
                      if validator.packets > before:
                          last = last_progress = time.monotonic()
                          if first is None:
                              first = last
                  except TimeoutError:
                      pass
                  if packets and validator.packets >= packets or stop_requested or time.monotonic() - last_progress > 0.25:
                      if finished is None and time.monotonic() >= next_status_poll:
                          report['usb_reader'] = reader.stats
                          report['phase'] = 'checking_terminal_state'
                          words = mailbox(dev)
                          report['last_status'] = words
                          if words[7] in range(2, 11):
                              finished = words
                          next_status_poll = time.monotonic() + 0.05
                      if finished is not None and validator.packets >= finished[10]:
                          while True:
                              try:
                                  _, raw = reader.read(0.05)
                                  validator.feed(raw)
                              except TimeoutError:
                                  break
                          break
                  if time.monotonic() - last_progress > 3:
                      raise RuntimeError('No validated DMA progress for 3 seconds')
              report['usb_reader'] = reader.stats
          words = mailbox(dev)
          report['final_mailbox'] = words
          report['registers'] = {hex(a): hex(dev.rr(a)) for a in (1409286416, 1409286664, 1409286912, 1409286916, 1409286920, 1409286924)}
          report.update(packets=validator.packets, payload_bytes=validator.packets * PAYLOAD_BYTES, wire_bytes=validator.packets * FRAME_BYTES, stop_requested=stop_requested, state=words[7], submitted=words[10], completed=words[11], timer_ticks=words[12])
          if last is not None:
              elapsed = last - start
              report['host_seconds'] = elapsed
              report['payload_MB_s'] = validator.packets * PAYLOAD_BYTES / elapsed / 1000000.0
          if words[7] != (3 if stop_requested else 2) or words[10] != words[11] or words[10] != validator.packets or words[13]:
              raise RuntimeError(f'Firmware stopped in state {words[7]} ({words[10]} submitted, {words[11]} completed, {validator.packets} received, DMA errors {words[13]:#x})')
          validator.finish(packets if packets else words[10])
          if report['registers']['0x54000110'] != '0x0':
              raise RuntimeError('DMA hardware reported an error')
          report['phase'] = 'framing_verified'
          if validator_type is Validator:
              report.update(phase='verified', byte_exact=True, synthetic_dma_streaming=True)
          return validator

      class LiveIQValidator(Validator):
          EVENT_EXT = 245

          def __init__(self, nonce, prefix_bytes=1024 * 1024, on_payload=None):
              super().__init__(nonce)
              if not 0 <= prefix_bytes <= 256 * 1024 * 1024:
                  raise ValueError('Capture prefix must be between 0 and 256 MiB')
              self.prefix_bytes = prefix_bytes
              self.tail = deque(maxlen=32)
              self.prefix = bytearray()
              self.digest = hashlib.sha256()
              self.on_payload = on_payload

          def validate_payload(self, frame, sequence):
              data = frame[44:-4].tobytes()
              if np.any(np.frombuffer(data, dtype='<u2') & 49152):
                  raise ValueError('I/Q components contain bits outside raw14')
              self.digest.update(data)
              self.tail.append((sequence, data))
              remaining = self.prefix_bytes - len(self.prefix)
              if remaining > 0:
                  self.prefix.extend(data[:remaining])
              if self.on_payload is not None:
                  self.on_payload(sequence, data)

      def capture_live(dev, protocol, report, seconds, packets, depth, aggregate_kib=32, configure_rf=None, prefix_bytes=1024 * 1024, image=None, manifest=None, on_payload=None, stop=None, validator_type=LiveIQValidator):
          LiveIQValidator(0, prefix_bytes)
          verify_image(image, manifest)
          if manifest['format'] != 'birriasdr-iq-stream-v1':
              raise ValueError('Expected the original streaming image')

          def setup(device, status):
              configure_capture(device, status)
              if configure_rf is not None:
                  configure_rf(device, status)
              if aggregate_kib:
                  device.rmw(MT_UDMA_WLCFG_0, 65535, 1 << 21 | aggregate_kib << 8 | 100)
                  device.rmw(MT_UDMA_WLCFG_1, 255, 30)
              status['usb_aggregation_kib'] = aggregate_kib
          try:
              validator = run_stream(dev, protocol, image, manifest, report, packets or 0, seconds, depth, configure=setup, validator_type=lambda nonce: validator_type(nonce, prefix_bytes, on_payload), stop=stop)
          finally:
              try:
                  produced, control, producer, power, backlog, poll = struct.unpack('<6I', read(dev, MAILBOX + 64, 24))
                  report.update(produced_units_mod32=produced, capture_control=hex(control), capture_producer=hex(producer), radio_power_on_return=power, max_backlog_units=backlog, max_producer_poll_us=poll)
              except Exception as exc:
                  report['capture_status_error'] = str(exc)
          independent = read(dev, 3760193536, 262144)
          compared = 0
          for sequence, data in validator.tail:
              age = produced - sequence * 2048 & 4294967295
              if not 2048 <= age <= 65536:
                  continue
              offset = (sequence & 31) * 8192
              if data != independent[offset:offset + 8192]:
                  report['tail_mismatch_packet'] = sequence
                  raise RuntimeError('Live DMA tail differs from stopped SRAM')
              compared += len(data)
          if not compared:
              raise RuntimeError('No intact tail packet available for independent comparison')
          report.update(raw14_valid=True, tail_byte_exact_sram=True, tail_bytes_compared=compared, samples=validator.packets * 2048, sha256_iq=validator.digest.hexdigest(), continuous_capture_validated=True, phase='continuous_capture_verified')
          return bytes(validator.prefix)

      def recover():
          hubs = []
          if not Path('/proc/device-tree/model').read_bytes().startswith(b'Raspberry Pi 5 '):
              raise RuntimeError('This recovery procedure is specific to the Raspberry Pi 5')
          for bus in (1, 2, 3, 4):
              hub = usb.core.find(idVendor=7531, bus=bus)
              if hub is None:
                  raise RuntimeError(f'Root hub {bus} missing')
              others = [d for d in usb.core.find(find_all=True, bus=bus) if d.address != 1 and (d.idVendor, d.idProduct) not in SUPPORTED_DEVICES]
              if others:
                  raise RuntimeError(f'Other devices present on bus {bus}')
              desc = hub.ctrl_transfer(160, 6, 10752 if hub.idProduct == 3 else 10496, 0, 12, 1000)
              hubs.append((hub, desc[2]))
              print('hub', bus, 'descriptor', bytes(desc).hex(), flush=True)
          try:
              for hub, ports in hubs:
                  for port in range(1, ports + 1):
                      print('off', hub.bus, port, flush=True)
                      hub.ctrl_transfer(35, 1, 8, port, None, 1000)
              time.sleep(3)
          finally:
              failures = []
              for hub, ports in hubs:
                  for port in range(1, ports + 1):
                      print('on', hub.bus, port, flush=True)
                      try:
                          hub.ctrl_transfer(35, 3, 8, port, None, 1000)
                      except Exception as exc:
                          failures.append((hub.bus, port, str(exc)))
              if failures:
                  raise RuntimeError(f'USB power restoration errors: {failures}')
          time.sleep(3)
          present = any(((d.idVendor, d.idProduct) in SUPPORTED_DEVICES for d in usb.core.find(find_all=True)))
          print('dongle present', present)
          if not present:
              raise RuntimeError('Dongle did not re-enumerate after the power cycle')

      def prepare_cold_device(report):
          if not Path('/proc/device-tree/model').read_bytes().startswith(b'Raspberry Pi 5 '):
              raise RuntimeError('The cold-start procedure is for Raspberry Pi 5 only')
          for net in Path('/sys/class/net').glob('*'):
              device = net / 'device'
              if device.exists() and '/usb' in str(device.resolve()):
                  if (net / 'operstate').read_text().strip() == 'up':
                      raise RuntimeError(f'{net.name} is an active USB network interface')
          devices = list(usb.core.find(find_all=True))
          targets = [d for d in devices if (d.idVendor, d.idProduct) in SUPPORTED_DEVICES]
          if len(targets) != 1 or any((d.address != 1 and d not in targets for d in devices)):
              raise RuntimeError('Cold start requires exactly the COMFAST dongle and USB root hubs')
          controls = [Path(f'/sys/bus/usb/devices/usb{bus}/interface_authorized_default') for bus in (1, 2, 3, 4)]
          original = {p: p.read_text() for p in controls}
          cold = report['cold_boot'] = dict(defaults_before={str(p): v.strip() for p, v in original.items()}, defaults_restored=False, power_cycled=False)
          changed = []
          report['hardware_attempted'] = True
          try:
              for path in controls:
                  path.write_text('0')
                  changed.append(path)
              recover()
              cold['power_cycled'] = True
              raw = next((d for d in usb.core.find(find_all=True) if (d.idVendor, d.idProduct) in SUPPORTED_DEVICES))
              topology = f'{raw.bus}-' + '.'.join(map(str, raw.port_numbers))
              interfaces = list(Path('/sys/bus/usb/devices').glob(topology + ':*'))
              if len(interfaces) != 1:
                  raise RuntimeError('Unexpected COMFAST interface count after cold start')
              interface = interfaces[0]
              cold['interface'] = interface.name
              cold['authorized_at_enumeration'] = (interface / 'authorized').read_text().strip()
              cold['driver_bound_at_enumeration'] = (interface / 'driver').exists()
              if cold['authorized_at_enumeration'] != '0' or cold['driver_bound_at_enumeration']:
                  raise RuntimeError('Could not exclude kernel driver activity at enumeration')
              (interface / 'authorized').write_text('1')
              if (interface / 'driver').exists():
                  raise RuntimeError('A kernel driver bound before the custom boot test')
              cold['interface_authorized_for_libusb'] = True
          finally:
              failures = []
              for path in reversed(changed):
                  try:
                      path.write_text(original[path])
                  except OSError as exc:
                      failures.append(f'{path}: {exc}')
              cold['defaults_restored'] = not failures
              if failures:
                  cold['restore_errors'] = failures
                  raise RuntimeError('Could not restore USB interface defaults: ' + '; '.join(failures))

      class Timeval(C.Structure):
          _fields_ = [('seconds', C.c_long), ('microseconds', C.c_long)]

      class AsyncBulk:

          def __init__(self, device, endpoint, depth=16, size=65536):
              self.device = device
              self.endpoint = endpoint
              self.depth = depth
              self.size = size
              self.lib = device._ctx.backend.lib
              self.context = device._ctx.backend.ctx
              self.handle = device._ctx.handle.handle
              self.queue = deque()
              self.transfers = []
              self.buffers = []
              self.pending = set()
              self.closing = False
              self.failure = None
              self.completed = 0
              self.bytes_received = 0
              self.high_water = 0
              self.callback = backend._libusb_transfer_cb_fn_p(self._callback)
              self.lib.libusb_cancel_transfer.argtypes = [backend._libusb_transfer_p]
              self.lib.libusb_handle_events_timeout.argtypes = [C.c_void_p, C.POINTER(Timeval)]

          def _submit(self, transfer):
              result = self.lib.libusb_submit_transfer(transfer)
              if result:
                  raise RuntimeError(f'libusb submit failed: {result}')
              self.pending.add(C.addressof(transfer.contents))

          def _callback(self, transfer):
              self.pending.discard(C.addressof(transfer.contents))
              if self.closing:
                  return
              try:
                  t = transfer.contents
                  if t.status != 0:
                      raise RuntimeError(f'Bulk transfer status {t.status}')
                  if t.actual_length:
                      self.queue.append((time.perf_counter_ns(), C.string_at(t.buffer, t.actual_length)))
                      self.completed += 1
                      self.bytes_received += t.actual_length
                      self.high_water = max(self.high_water, len(self.queue))
                  if len(self.queue) > 4096:
                      raise RuntimeError('USB consumer overrun')
                  self._submit(transfer)
              except Exception as exc:
                  self.failure = exc

          def __enter__(self):
              try:
                  for _ in range(self.depth):
                      transfer = self.lib.libusb_alloc_transfer(0)
                      if not transfer:
                          raise MemoryError('libusb transfer allocation failed')
                      self.transfers.append(transfer)
                      buffer = C.create_string_buffer(self.size)
                      self.buffers.append(buffer)
                      t = transfer.contents
                      t.dev_handle = self.handle
                      t.endpoint = self.endpoint
                      t.type = 2
                      t.timeout = 0
                      t.length = self.size
                      t.buffer = C.addressof(buffer)
                      t.callback = self.callback
                      self._submit(transfer)
                  return self
              except BaseException:
                  self.__exit__(None, None, None)
                  raise

          def _events(self, seconds):
              tv = Timeval(0, int(seconds * 1000000.0))
              result = self.lib.libusb_handle_events_timeout(self.context, C.byref(tv))
              if result not in (0, -10):
                  raise RuntimeError(f'libusb events failed: {result}')

          def read(self, timeout=0.1):
              deadline = time.monotonic() + timeout
              while not self.queue:
                  if self.failure:
                      raise self.failure
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError('No asynchronous USB data')
                  self._events(min(0.05, remaining))
              return self.queue.popleft()

          @property
          def stats(self):
              return dict(transfers=self.completed, bytes=self.bytes_received, queue_high_water=self.high_water, queued=len(self.queue), error=str(self.failure) if self.failure else 0)

          def __exit__(self, *_):
              self.closing = True
              for transfer in self.transfers:
                  if C.addressof(transfer.contents) in self.pending:
                      self.lib.libusb_cancel_transfer(transfer)
              while self.pending:
                  self._events(0.05)
              for transfer in self.transfers:
                  self.lib.libusb_free_transfer(transfer)
              self.transfers.clear()
              self.buffers.clear()

      class PythonBulk(AsyncBulk):

          def __init__(self, *args, **kwargs):
              super().__init__(*args, **kwargs)
              self.ready = threading.Condition()
              self.thread = None

          def _callback(self, transfer):
              with self.ready:
                  super()._callback(transfer)
                  self.ready.notify_all()

          def _pump(self):
              try:
                  while not self.closing or self.pending:
                      self._events(0.01)
              except Exception as exc:
                  with self.ready:
                      self.failure = exc
                      self.ready.notify_all()

          def __enter__(self):
              super().__enter__()
              self.thread = threading.Thread(target=self._pump, name='python-libusb', daemon=True)
              self.thread.start()
              return self

          def read(self, timeout=0.1):
              with self.ready:
                  if not self.ready.wait_for(lambda: self.queue or self.failure, timeout):
                      raise TimeoutError('No Python USB data')
                  if self.failure:
                      raise self.failure
                  return self.queue.popleft()

          def __exit__(self, *args):
              if self.thread is not None:
                  self.closing = True
                  import ctypes
                  for transfer in self.transfers:
                      if ctypes.addressof(transfer.contents) in self.pending:
                          self.lib.libusb_cancel_transfer(transfer)
                  self.thread.join(3)
                  if self.thread.is_alive():
                      raise RuntimeError('libusb cancellation did not drain; preserving transfer storage')
              return super().__exit__(*args)

      FRAME = struct.Struct('<4sIQ')

      CHUNK_SAMPLES = 262144

      SAMPLE_RATE = 40000000

      class StreamingIQValidator(LiveIQValidator):
          """Check sample bits and hash in batches; preserve every packet and sample.

          Tiny per-packet NumPy/hash calls release the GIL thousands of times per
          second and can starve framing while the USB thread fills its queue.
          Header/sequence/nonce checks still happen for every packet in Validator.
          """

          def __init__(self, nonce, prefix_bytes=0, on_payload=None):
              if prefix_bytes:
                  raise ValueError('Streaming validator uses the host ring, not a capture prefix')
              super().__init__(nonce, 0, on_payload)
              self.batch = []
              self.batch_first = 0

          def validate_payload(self, frame, sequence):
              data = frame[44:-4].tobytes()
              self.tail.append((sequence, data))
              if not self.batch:
                  self.batch_first = sequence
              self.batch.append(data)
              if len(self.batch) == CHUNK_SAMPLES // 2048:
                  self.flush()

          def flush(self):
              if not self.batch:
                  return
              data = b''.join(self.batch)
              if np.any(np.frombuffer(data, dtype='<u2') & 49152):
                  raise ValueError('I/Q components contain bits outside raw14')
              self.digest.update(data)
              if self.on_payload is not None:
                  self.on_payload(self.batch_first, data)
              self.batch.clear()

          def finish(self, expected):
              super().finish(expected)
              self.flush()

      def capture_worker(emit, stop, seconds, report, gain_mode, lna, lpf, digital, cold):
          if gain_mode not in ('manual', 'automatic') or any((type(v) is not int or not 0 <= v <= limit for v, limit in ((lna, 3), (lpf, 8), (digital, 12)))):
              raise ValueError('Gain mode manual/automatic; LNA 0..3, LPF 0..8, digital 0..12')
          report.update(complete=False, sample_rate_hz=SAMPLE_RATE, requested_frequency_hz=2437000000, frequency_hz=None, rf_reception_validated=False, full_agc_control_validated=False, capture_bits=14, raw_format='little-endian raw14 Q,I', vendor_firmware_bytes_sent=0, delivered_samples=0, gain_mode=gain_mode, gain_codes=dict(lna=lna, lpf=lpf, digital=digital))
          gain = None

          def setup(dev, status):
              nonlocal gain
              spi = configure_rx_experiment(dev, status)
              gain = GainControl(dev, spi)
              status['gain_before'] = gain.manual(lna, lpf, digital) if gain_mode == 'manual' else gain.automatic()
              emit(b'META', 0, json.dumps(status).encode())

          def payload(sequence, data):
              if sequence * 2048 != report['delivered_samples']:
                  raise RuntimeError('Output batch discontinuity')
              emit(b'IQ14', report['delivered_samples'], data)
              report['delivered_samples'] += len(data) // 4
          with redirect_stdout(sys.stderr):
              with exclusive_device(m, usb, report, prepare=prepare_cold_device if cold else None) as dev:
                  capture_live(dev, m, report, seconds, 0, 128, configure_rf=setup, prefix_bytes=0, image=ORIGINAL_IMAGE, manifest=ORIGINAL_MANIFEST, on_payload=payload, stop=stop, validator_type=StreamingIQValidator)
                  report['gain_after'] = gain.status()
                  report['gain_restored'] = gain.automatic()
              if report.get('cleanup_reset') is not True:
                  raise RuntimeError('WFSYS reset did not recover the dongle')
          if report['samples'] != report['delivered_samples']:
              raise RuntimeError('Captured and delivered sample counts differ')
          report['complete'] = True

      def main():
          parser = argparse.ArgumentParser(description='BirriaSDR original firmware USB worker')
          parser.add_argument('--helper', action='store_true')
          parser.add_argument('--channel', type=int, choices=(6,), default=6)
          parser.add_argument('--seconds', type=float, default=0)
          parser.add_argument('--report', type=Path)
          parser.add_argument('--ring', type=Path, required=True)
          parser.add_argument('--python-path', action='append', default=[])
          parser.add_argument('--gain-mode', choices=('manual', 'automatic'), default='automatic')
          parser.add_argument('--lna', type=int, choices=range(4), default=1)
          parser.add_argument('--lpf', type=int, choices=range(9), default=4)
          parser.add_argument('--digital', type=int, choices=range(13), default=0)
          parser.add_argument('--cold-pi5', action='store_true')
          args = parser.parse_args()
          if not 0 <= args.seconds < float('inf'):
              parser.error('seconds must be finite and nonnegative')
          stop = threading.Event()
          credit = threading.Condition()
          acknowledged = sent = 0

          def control():
              nonlocal acknowledged
              pending = bytearray()
              while True:
                  data = os.read(0, 8 - len(pending))
                  if not data:
                      stop.set()
                      with credit:
                          credit.notify_all()
                      return
                  pending.extend(data)
                  if len(pending) != 8:
                      continue
                  value, = struct.unpack('<Q', pending)
                  pending.clear()
                  with credit:
                      if value == 18446744073709551615:
                          stop.set()
                      elif value == acknowledged + 1:
                          acknowledged = value
                      else:
                          stop.set()
                      credit.notify_all()
          threading.Thread(target=control, daemon=True).start()
          for sig in (signal.SIGINT, signal.SIGTERM):
              signal.signal(sig, lambda *_: stop.set())
          out = sys.stdout.buffer
          report = {}
          status = 0
          with args.ring.open('r+b', buffering=0) as ring_file:
              with mmap.mmap(ring_file.fileno(), CHUNK_SAMPLES * 4 * 32) as ring:
                  ring[::4096] = bytes(len(ring[::4096]))

                  def emit(kind, sample, data):
                      nonlocal sent
                      started = time.perf_counter()
                      if kind == b'IQ14':
                          with credit:
                              if not credit.wait_for(lambda: sent - acknowledged < 32, timeout=0.5):
                                  raise RuntimeError('CyberEther shared-memory consumer stalled')
                          offset = sent % 32 * CHUNK_SAMPLES * 4
                          ready = time.perf_counter()
                          ring[offset:offset + len(data)] = data
                          stored = time.perf_counter()
                          out.write(FRAME.pack(kind, len(data), sample))
                          sent += 1
                      else:
                          out.write(FRAME.pack(kind, len(data), sample))
                          out.write(data)
                      out.flush()
                      if kind == b'IQ14':
                          report['max_ring_credit_ms'] = max(report.get('max_ring_credit_ms', 0), (ready - started) * 1000)
                          report['max_ring_write_ms'] = max(report.get('max_ring_write_ms', 0), (stored - ready) * 1000)
                          report['max_ring_notify_ms'] = max(report.get('max_ring_notify_ms', 0), (time.perf_counter() - stored) * 1000)
                  try:
                      capture_worker(emit, stop, args.seconds, report, args.gain_mode, args.lna, args.lpf, args.digital, args.cold_pi5)
                  except Exception as exc:
                      report.update(complete=False, error=str(exc))
                      print('BirriaSDR: ' + str(exc), file=sys.stderr, flush=True)
                      status = 1
                  finally:
                      if args.report:
                          args.report.write_text(json.dumps(report, indent=2) + '\n')
                      with suppress(BrokenPipeError, OSError):
                          emit(b'DONE', report.get('samples', 0), json.dumps(report).encode())
                      print('BirriaSDR result: ' + json.dumps(report), file=sys.stderr, flush=True)
          return status

      def complex_samples(raw):
          """Preserve all 14 captured bits; exact binary normalization into CF32."""
          if not raw or len(raw) % 16:
              raise ValueError('Incomplete dense I/Q beat')
          words = np.frombuffer(raw, dtype='<u2').reshape(-1, 2)
          if np.any(words & 49152):
              raise ValueError('I/Q component exceeds the raw14 format')
          signed = (words ^ 8192).astype(np.int16) - np.int16(8192)
          out = np.empty(len(words), dtype=np.complex64)
          np.multiply(signed[:, 1], np.float32(1 / 8192), out=out.real)
          np.multiply(signed[:, 0], np.float32(1 / 8192), out=out.imag)
          return out

      class Source:

          def __init__(self, channel=6, python=None, use_sudo=None, seconds=0, gain_mode='automatic', lna=1, lpf=4, digital=0, cold=None, drop_on_overrun=False):
              self.queue = queue.Queue(maxsize=32)
              self.drop_on_overrun = drop_on_overrun
              self.dropped_chunks = 0
              self.metadata = None
              self.report = None
              self.error = None
              self.closed = False
              self.received_samples = 0
              self.output_samples = 0
              self.log = deque(maxlen=30)
              self.control_lock = threading.Lock()
              self.stop_sent = False
              self.ring_directory = ring_directory()
              self.ring_path = Path(self.ring_directory.name) / 'iq'
              self.ring_file = self.ring_path.open('w+b', buffering=0)
              self.ring_file.truncate(CHUNK_SAMPLES * 4 * 32)
              self.ring = mmap.mmap(self.ring_file.fileno(), CHUNK_SAMPLES * 4 * 32)
              self.ring[:] = bytes(CHUNK_SAMPLES * 4 * 32)
              self.started = time.monotonic()
              python = python or os.environ.get('SDR_WIFI_PYTHON') or sys.executable
              if not python:
                  raise RuntimeError('Set PYTHON to the Python 3.11+ interpreter selected in CyberEther')
              if use_sudo is None:
                  use_sudo = sys.platform.startswith('linux') and os.geteuid() != 0
              helper = worker_script(self.ring_directory.name)
              command = [python, '-E', '-B', '-u', str(helper), '--helper', '--channel', str(channel), '--seconds', str(seconds), '--ring', str(self.ring_path)]
              command += ['--gain-mode', gain_mode, '--lna', str(lna), '--lpf', str(lpf), '--digital', str(digital)]
              model = Path('/proc/device-tree/model')
              if cold is None:
                  cold = model.exists() and model.read_bytes().startswith(b'Raspberry Pi 5 ')
              if cold:
                  command.append('--cold-pi5')
              package_paths = {str(Path(np.__file__).resolve().parent.parent)}
              try:
                  import usb
                  package_paths.add(str(Path(usb.__file__).resolve().parent.parent))
              except ImportError:
                  pass
              try:
                  import libusb_package
                  package_paths.add(str(Path(libusb_package.__file__).resolve().parent.parent))
              except ImportError:
                  pass
              for path in sorted(package_paths):
                  command += ['--python-path', path]
              if use_sudo:
                  command = ['sudo', '-n', *command]
              env = dict(os.environ, PYTHONDONTWRITEBYTECODE='1')
              self.process = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, bufsize=0, env=env)
              self.reader = threading.Thread(target=self._receive, name='mt7961-iq', daemon=True)
              self.logger = threading.Thread(target=self._logs, name='mt7961-log', daemon=True)
              self.logger.start()
              self.reader.start()

          def _logs(self):
              for line in iter(self.process.stderr.readline, b''):
                  text = line.decode(errors='replace').rstrip()
                  self.log.append(text)
                  print(text, flush=True)

          def _read_exact(self, size):
              parts = bytearray(size)
              view = memoryview(parts)
              position = 0
              while position < size:
                  count = self.process.stdout.readinto(view[position:])
                  if not count:
                      raise EOFError('Receiver helper closed its stream')
                  position += count
              return parts

          def _request_stop(self):
              with self.control_lock:
                  if not self.stop_sent:
                      self.stop_sent = True
                      try:
                          self.process.stdin.write(struct.pack('<Q', 18446744073709551615))
                      except (BrokenPipeError, OSError):
                          pass

          def _receive(self):
              frames = 0
              try:
                  while True:
                      kind, length, sample = FRAME.unpack(self._read_exact(FRAME.size))
                      if length > CHUNK_SAMPLES * 4 or length == 0:
                          raise RuntimeError('Invalid receiver frame length')
                      if kind == b'IQ14':
                          offset = frames % 32 * CHUNK_SAMPLES * 4
                          data = self.ring[offset:offset + length]
                          frames += 1
                          with self.control_lock:
                              self.process.stdin.write(struct.pack('<Q', frames))
                      else:
                          data = self._read_exact(length)
                      if kind == b'META':
                          if self.metadata is not None or self.received_samples:
                              raise RuntimeError('Unexpected receiver metadata')
                          self.metadata = json.loads(data)
                      elif kind == b'DONE':
                          self.report = json.loads(data)
                          if not self.report.get('complete'):
                              raise RuntimeError(self.report.get('error', 'Receiver integrity check failed'))
                          if self.report['delivered_samples'] != self.received_samples:
                              raise RuntimeError('Receiver sample count does not match delivered frames')
                          return
                      elif kind == b'IQ14':
                          if self.metadata is None or sample != self.received_samples or length % 16:
                              raise RuntimeError('Lost, duplicated or malformed receiver frame')
                          self.received_samples += length // 4
                          if not self.closed and self.error is None:
                              try:
                                  self.queue.put_nowait((sample, data))
                              except queue.Full:
                                  if self.drop_on_overrun:
                                      # Chunks are copies of the ring, so discarding one never stalls the worker.
                                      try:
                                          self.queue.get_nowait()
                                      except queue.Empty:
                                          pass
                                      self.dropped_chunks += 1
                                      self.queue.put_nowait((sample, data))
                                  else:
                                      self.error = RuntimeError('CyberEther cannot keep up: I/Q queue full; reception stopped')
                                      self._request_stop()
                      else:
                          raise RuntimeError('Unknown receiver frame type')
              except Exception as exc:
                  self.error = self.error or exc
                  self._request_stop()

          def poll(self):
              if self.error:
                  raise RuntimeError(f'MT7961: {self.error}. ' + '\n'.join(self.log)) from self.error
              if self.metadata is None and time.monotonic() - self.started > 60:
                  self._request_stop()
                  raise RuntimeError('MT7961 startup timed out. ' + '\n'.join(self.log))
              try:
                  sample, raw = self.queue.get_nowait()
              except queue.Empty:
                  if self.report is not None and (not self.closed):
                      raise RuntimeError('MT7961 session ended; reload the Python source to restart')
                  return None
              if len(raw) != CHUNK_SAMPLES * 4:
                  return None
              iq = complex_samples(raw)
              self.output_samples += len(iq)
              return (sample, iq)

          def close(self):
              if self.closed:
                  return
              self.closed = True
              self._request_stop()
              self.reader.join(15)
              try:
                  self.process.wait(timeout=3)
              except subprocess.TimeoutExpired as exc:
                  raise RuntimeError('USB helper did not finish cleanup; leave its files intact') from exc
              self.logger.join(2)
              for stream in (self.process.stdout, self.process.stderr):
                  stream.close()
              self.process.stdin.close()
              if self.reader.is_alive():
                  raise RuntimeError('I/Q reader failed to stop')
              self.ring.close()
              self.ring_file.close()
              self.ring_directory.cleanup()

      _source = None


      def compute(ctx):
          global _source
          if _source is None:
              _source = Source(python=PYTHON, use_sudo=USE_SUDO, gain_mode=GAIN_MODE,
                               lna=LNA_GAIN, lpf=LPF_GAIN, digital=DIGITAL_GAIN, cold=COLD_PI5,
                               drop_on_overrun=DROP_ON_OVERRUN)
          block = _source.poll()
          if block is None:
              time.sleep(.001)
              return SKIP
          first_sample, iq = block
          ctx.outputs[0][...] = iq.reshape(ctx.outputs[0].shape)
          attrs = ctx.output_attrs[0]
          attrs['sampleRate'] = np.float32(_source.metadata['sample_rate_hz'])
          attrs['frequency'] = np.float32(_source.metadata['requested_frequency_hz'])
          attrs['frequencyStatus'] = 'requested center; absolute frequency calibration not validated'
          attrs['rfInitializationProfile'] = 'channel 6; cold reception verified on COMFAST 3574:6211 / Pi 5'
          # Per-capture signal validation is offline; this block checks transport only.
          attrs['rfReceptionValidated'] = False
          attrs['firstSample'] = np.uint64(first_sample)
          attrs['captureBits'] = np.uint64(14)
          attrs['continuous'] = _source.dropped_chunks == 0
          attrs['droppedChunks'] = np.uint64(_source.dropped_chunks)
          attrs['sampleRateStatus'] = 'nominal; not externally calibrated'
          attrs['samplesDelivered'] = np.uint64(_source.output_samples)
          attrs['gainMode'] = _source.metadata['gain_mode']


      def cleanup():
          global _source
          if _source is not None:
              _source.close()
              _source = None


      if globals().get('__name__') == '__main__':
          if '--helper' in sys.argv:
              raise SystemExit(main())
          else:
              print('Load this file into a CyberEther Python block, or open the bundled flowgraph.')
