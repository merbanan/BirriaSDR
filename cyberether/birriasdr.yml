          return tempfile.TemporaryDirectory(prefix='birriasdr-ring-')


      CHIP_MT7921 = 'mt7921'

      SUPPORTED_DEVICES = {(13684, 25105): CHIP_MT7921, (3725, 31073): CHIP_MT7921}

      N_BULK_IN = 2

      N_BULK_OUT = 6

      USB_ENDPOINT_XFER_BULK = 2

      USB_ENDPOINT_DIR_IN = 128

      WIFI_INTERFACE_CLASS = (255, 255, 255)

      @dataclass(frozen=True)
      class EndpointDesc:
          address: int
          attributes: int

          @property
          def is_bulk(self) -> bool:
              return self.attributes & 3 == USB_ENDPOINT_XFER_BULK

          @property
          def is_in(self) -> bool:
              return bool(self.address & USB_ENDPOINT_DIR_IN)

      @dataclass(frozen=True)
      class InterfaceDesc:
          number: int
          interface_class: int
          subclass: int
          protocol: int
          endpoints: tuple[EndpointDesc, ...]

          @property
          def class_triple(self) -> tuple[int, int, int]:
              return (self.interface_class, self.subclass, self.protocol)

      @dataclass(frozen=True)
      class UsbLayout:
          """What open() resolved from the descriptors: which interface holds the Wi-Fi
          function and which endpoint addresses play which mt76 role."""
          vid: int
          pid: int
          chip: str
          interface: int
          in_eps: tuple[int, ...]
          out_eps: tuple[int, ...]

          @property
          def usb_id(self) -> str:
              return f'{self.vid:04x}:{self.pid:04x}'

          @property
          def ep_in_pkt_rx(self) -> int:
              return self.in_eps[0]

          @property
          def ep_in_cmd_resp(self) -> int:
              return self.in_eps[1]

          @property
          def ep_out_inband_cmd(self) -> int:
              return self.out_eps[0]

          @property
          def ep_out_ac_be(self) -> int:
              return self.out_eps[1]

      class UnsupportedDevice(RuntimeError):
          """No usable device, or the descriptors do not match what mt76 requires."""

      def _describe_interfaces(interfaces: list[InterfaceDesc]) -> str:
          parts = []
          for intf in interfaces:
              bulk_in = sum((1 for ep in intf.endpoints if ep.is_bulk and ep.is_in))
              bulk_out = sum((1 for ep in intf.endpoints if ep.is_bulk and (not ep.is_in)))
              cls = '/'.join((f'{v:02x}' for v in intf.class_triple))
              parts.append(f'intf {intf.number} class {cls} bulk in/out {bulk_in}/{bulk_out}')
          return '; '.join(parts) or 'no interfaces'

      def select_wifi_interface(interfaces: list[InterfaceDesc]) -> tuple[int, tuple, tuple]:
          """Pick the interface mt76 would bind and assign its endpoints positionally.

          Returns (interface number, in endpoint addresses, out endpoint addresses).
          Raises UnsupportedDevice when no interface qualifies or more than one does, so a
          layout this code has never seen fails closed with the descriptors it saw.
          """
          candidates = []
          for intf in interfaces:
              if intf.class_triple != WIFI_INTERFACE_CLASS:
                  continue
              in_eps: list[int] = []
              out_eps: list[int] = []
              for ep in intf.endpoints:
                  if not ep.is_bulk:
                      continue
                  if ep.is_in and len(in_eps) < N_BULK_IN:
                      in_eps.append(ep.address)
                  elif not ep.is_in and len(out_eps) < N_BULK_OUT:
                      out_eps.append(ep.address)
              if len(in_eps) == N_BULK_IN and len(out_eps) == N_BULK_OUT:
                  candidates.append((intf.number, tuple(in_eps), tuple(out_eps)))
          if not candidates:
              raise UnsupportedDevice(f'no interface with class ff/ff/ff and at least {N_BULK_IN} bulk IN + {N_BULK_OUT} bulk OUT endpoints ({_describe_interfaces(interfaces)})')
          if len(candidates) > 1:
              numbers = ', '.join((str(c[0]) for c in candidates))
              raise UnsupportedDevice(f'ambiguous layout: interfaces {numbers} all qualify ({_describe_interfaces(interfaces)})')
          return candidates[0]

      def interfaces_from_pyusb(dev) -> list[InterfaceDesc]:
          """Flatten the active configuration's interfaces (alternate setting 0 only)."""
          cfg = dev.get_active_configuration()
          out = []
          for intf in cfg:
              if intf.bAlternateSetting != 0:
                  continue
              eps = tuple((EndpointDesc(ep.bEndpointAddress, ep.bmAttributes) for ep in intf))
              out.append(InterfaceDesc(intf.bInterfaceNumber, intf.bInterfaceClass, intf.bInterfaceSubClass, intf.bInterfaceProtocol, eps))
          return out

      def layout_from_pyusb(dev) -> UsbLayout:
          key = (dev.idVendor, dev.idProduct)
          chip = SUPPORTED_DEVICES.get(key)
          if chip is None:
              raise UnsupportedDevice(f'device {key[0]:04x}:{key[1]:04x} is not in SUPPORTED_DEVICES')
          number, in_eps, out_eps = select_wifi_interface(interfaces_from_pyusb(dev))
          return UsbLayout(key[0], key[1], chip, number, in_eps, out_eps)

      def parse_usb_id(text: str) -> tuple[int, int]:
          """'0846:9072' -> (0x0846, 0x9072)."""
          try:
              vid, pid = text.lower().split(':')
              return (int(vid, 16), int(pid, 16))
          except ValueError as exc:
              raise ValueError(f'usb id must look like 0e8d:7961, got {text!r}') from exc

      def device_address(dev) -> str:
          """Where an adapter is plugged in, as "bus:address".

          Two adapters of the same model share a USB id, so the id cannot tell them apart.
          Bus and device address are the port the adapter is attached to: they distinguish
          identical units without reading a serial number, which the device treats as
          identifying information and which this project keeps out of its output. The value
          is not stable across a replug, which is why it names a port rather than a device.
          """
          return f'{dev.bus}:{dev.address}'

      def find_supported_devices(usb_id: str | None=None, address: str | None=None) -> list:
          """Attached pyusb devices whose VID:PID is supported, optionally narrowed.

          usb_id defaults to $MT76_USB_ID and address to $MT76_USB_ADDR, so a host with two
          adapters can pick one without changing code. With two adapters of the same model,
          only address separates them. Returns pyusb device objects; nothing is opened or
          claimed.
          """
          wanted = usb_id or os.environ.get('MT76_USB_ID') or None
          where = address or os.environ.get('MT76_USB_ADDR') or None
          keys = {parse_usb_id(wanted)} if wanted else set(SUPPORTED_DEVICES)
          found = []
          for dev in usb.core.find(find_all=True):
              if (dev.idVendor, dev.idProduct) not in keys:
                  continue
              if where is not None and device_address(dev) != where:
                  continue
              found.append(dev)
          return found

      def _ambiguous(candidates: list) -> str:
          """The message for an open that matched more than one adapter."""
          ids = ', '.join((f'{d.idVendor:04x}:{d.idProduct:04x}' for d in candidates))
          where = ', '.join((device_address(d) for d in candidates))
          return f'{len(candidates)} supported devices attached ({ids}); pass usb_id or set MT76_USB_ID to pick one, or address / MT76_USB_ADDR for two of the same model (attached at {where})'

      USB_TYPE_VENDOR = 64

      USB_DIR_IN = 128

      USB_DIR_OUT = 0

      MT_USB_TYPE_VENDOR = USB_TYPE_VENDOR | 31

      MT_USB_TYPE_UHW_VENDOR = USB_TYPE_VENDOR | 30

      MT_VEND_DEV_MODE = 1

      MT_VEND_WRITE = 2

      MT_VEND_POWER_ON = 4

      MT_VEND_READ_EXT = 99

      MT_VEND_WRITE_EXT = 102

      EP_OUT_INBAND_CMD = 8

      EP_OUT_AC_BE = 4

      EP_IN_PKT_RX = 132

      EP_IN_CMD_RESP = 133

      MT_HW_CHIPID = 1879114240

      MT_HW_REV = 1879114244

      MT_CONN_ON_MISC = 2080768240

      MT_TOP_MISC2_FW_PWR_ON = 1 << 0

      def MT_UMAC(ofs: int) -> int:
          return 1946157056 + ofs

      MT_UDMA_TX_QSEL = MT_UMAC(8)

      MT_FW_DL_EN = 1 << 3

      MT_UDMA_WLCFG_0 = MT_UMAC(24)

      MT_WL_RX_EN = 1 << 22

      MT_WL_TX_EN = 1 << 23

      MT_WL_RX_FLUSH = 1 << 19

      MT_UDMA_CONN_INFRA_STATUS = MT_UMAC(2592)

      MT_UDMA_CONN_WFSYS_INIT_DONE = 1 << 22

      MT_SSUSB_EPCTL_CSR_EP_RST_OPT = 1946228736 + 144

      def MT_UWFDMA0(ofs: int) -> int:
          return 2080522240 + ofs

      MT_UWFDMA0_GLO_CFG = MT_UWFDMA0(520)

      MT_WFDMA0_GLO_CFG_TX_DMA_EN = 1 << 0

      MT_WFDMA0_GLO_CFG_RX_DMA_EN = 1 << 2

      VEND_TIMEOUT_MS = 1000

      VEND_RETRIES = 10

      class Mt7921u:
          """Register-level access to an mt792x USB chip. Context manager.

          CHIP names which SUPPORTED_DEVICES entries this class drives; open() refuses a
          device whose descriptors resolve to another chip so an MT7925 is never driven
          with MT7921 command encodings by accident.
          """
          CHIP = CHIP_MT7921
          CHIP_IDS: tuple[int, ...] = (31073,)
          DECODER_MODULE = 'rxd'
          MAX_WIDTH_MHZ = 80

          def __init__(self, verbose: bool=False, usb_id: str | None=None, address: str | None=None):
              self.dev = None
              self.verbose = verbose
              self.usb_id = usb_id
              self.address = address
              self._claimed = []
              self.layout: UsbLayout | None = None
              self.ep_in_pkt_rx = EP_IN_PKT_RX
              self.ep_in_cmd_resp = EP_IN_CMD_RESP
              self.ep_out_inband_cmd = EP_OUT_INBAND_CMD
              self.ep_out_ac_be = EP_OUT_AC_BE

          def __enter__(self) -> Mt7921u:
              self.open()
              return self

          def __exit__(self, *exc) -> None:
              self.close()

          def open(self) -> None:
              """Find one supported device, resolve its layout, claim the Wi-Fi interface."""
              candidates = find_supported_devices(self.usb_id, self.address)
              if not candidates:
                  wanted = self.usb_id or os.environ.get('MT76_USB_ID') or 'any supported'
                  where = self.address or os.environ.get('MT76_USB_ADDR')
                  at = f' at {where}' if where else ''
                  raise UnsupportedDevice(f'device not found (looked for {wanted}{at})')
              if len(candidates) > 1:
                  raise UnsupportedDevice(_ambiguous(candidates))
              dev = candidates[0]
              layout = layout_from_pyusb(dev)
              if layout.chip != self.CHIP:
                  raise UnsupportedDevice(f'device {layout.usb_id} is an {layout.chip}; {type(self).__name__} drives {self.CHIP} (use open_device() to pick the class by USB id)')
              try:
                  usb.util.claim_interface(dev, layout.interface)
              except usb.core.USBError as exc:
                  raise RuntimeError(f'cannot claim interface {layout.interface}: {exc}') from exc
              self.dev = dev
              self._claimed.append(layout.interface)
              self.layout = layout
              self.ep_in_pkt_rx = layout.ep_in_pkt_rx
              self.ep_in_cmd_resp = layout.ep_in_cmd_resp
              self.ep_out_inband_cmd = layout.ep_out_inband_cmd
              self.ep_out_ac_be = layout.ep_out_ac_be
              chip_id = self.chip_id()
              if chip_id not in self.CHIP_IDS:
                  self.close()
                  raise UnsupportedDevice(f"device {layout.usb_id} reports chip id {chip_id:#06x}; {type(self).__name__} knows {[f'{c:#06x}' for c in self.CHIP_IDS]}")
              if self.verbose:
                  print(f"  opened {layout.usb_id} ({layout.chip}) interface {layout.interface} in={[f'{e:#04x}' for e in layout.in_eps]} out={[f'{e:#04x}' for e in layout.out_eps]}")

          def close(self) -> None:
              if self.dev is None:
                  return
              for intf in self._claimed:
                  with suppress(Exception):
                      usb.util.release_interface(self.dev, intf)
              self._claimed.clear()
              usb.util.dispose_resources(self.dev)
              self.dev = None

          def _vendor(self, req: int, req_type: int, value: int, index: int, data_or_len, timeout: int=VEND_TIMEOUT_MS):
              """__mt76u_vendor_request, including its retry loop."""
              last = None
              for _ in range(VEND_RETRIES):
                  try:
                      return self.dev.ctrl_transfer(req_type, req, value, index, data_or_len, timeout)
                  except usb.core.USBError as exc:
                      last = exc
                      time.sleep(0.005)
              raise RuntimeError(f'vendor request req:{req:02x} off:{index:04x} failed: {last}')

          def rr(self, addr: int) -> int:
              """mt792xu_rr: 32-bit register read via MT_VEND_READ_EXT."""
              buf = self._vendor(MT_VEND_READ_EXT, USB_DIR_IN | MT_USB_TYPE_VENDOR, addr >> 16 & 65535, addr & 65535, 4)
              val = struct.unpack('<I', bytes(buf))[0]
              if self.verbose:
                  print(f'    rr  0x{addr:08x} -> 0x{val:08x}')
              return val

          def wr(self, addr: int, val: int) -> None:
              """mt792xu_wr: 32-bit register write via MT_VEND_WRITE_EXT."""
              if self.verbose:
                  print(f'    wr  0x{addr:08x} <- 0x{val:08x}')
              self._vendor(MT_VEND_WRITE_EXT, USB_DIR_OUT | MT_USB_TYPE_VENDOR, addr >> 16 & 65535, addr & 65535, struct.pack('<I', val & 4294967295))

          def rmw(self, addr: int, mask: int, val: int) -> int:
              new = val | self.rr(addr) & ~mask & 4294967295
              self.wr(addr, new)
              return new

          def set_bits(self, addr: int, bits: int) -> int:
              return self.rmw(addr, bits, bits)

          def clear_bits(self, addr: int, bits: int) -> int:
              return self.rmw(addr, bits, 0)

          def uhw_rr(self, addr: int) -> int:
              """mt792xu_uhw_rr: USB host-wrapper register read."""
              buf = self._vendor(MT_VEND_DEV_MODE, USB_DIR_IN | MT_USB_TYPE_UHW_VENDOR, addr >> 16 & 65535, addr & 65535, 4)
              return struct.unpack('<I', bytes(buf))[0]

          def uhw_wr(self, addr: int, val: int) -> None:
              """mt792xu_uhw_wr: USB host-wrapper register write."""
              self._vendor(MT_VEND_WRITE, USB_DIR_OUT | MT_USB_TYPE_UHW_VENDOR, addr >> 16 & 65535, addr & 65535, struct.pack('<I', val & 4294967295))

          def copy(self, offset: int, data: bytes, chunk: int=512) -> None:
              """mt792xu_copy: bulk register-space write, 4-byte aligned."""
              if len(data) % 4:
                  data = data + b'\x00' * (4 - len(data) % 4)
              i = 0
              while i < len(data):
                  n = min(chunk, len(data) - i)
                  self._vendor(MT_VEND_WRITE_EXT, USB_DIR_OUT | MT_USB_TYPE_VENDOR, offset + i >> 16 & 65535, offset + i & 65535, data[i:i + n])
                  i += n

          def power_on(self) -> None:
              """mt792xu_mcu_power_on."""
              self._vendor(MT_VEND_POWER_ON, USB_DIR_OUT | MT_USB_TYPE_VENDOR, 0, 1, None)
              if not self.poll(MT_CONN_ON_MISC, MT_TOP_MISC2_FW_PWR_ON, MT_TOP_MISC2_FW_PWR_ON, 500):
                  raise RuntimeError('timeout waiting for FW_PWR_ON')

          def poll(self, addr: int, mask: int, expect: int, timeout_ms: int) -> bool:
              """mt76_poll_msec: read until (val & mask) == expect."""
              deadline = time.monotonic() + timeout_ms / 1000.0
              while True:
                  if self.rr(addr) & mask == expect:
                      return True
                  if time.monotonic() > deadline:
                      return False
                  time.sleep(0.01)

          def bulk_out(self, ep: int, data: bytes, timeout: int=1000) -> int:
              return self.dev.write(ep, data, timeout)

          def bulk_in(self, ep: int, length: int, timeout: int=1000) -> bytes:
              return bytes(self.dev.read(ep, length, timeout))

          def chip_id(self) -> int:
              """mt76_chip(): the low half of MT_HW_CHIPID (0x7961, 0x7925, 0x6639, ...).

              mt7925/usb.c:215-217 at c5a3bd91 builds rev = (rr(CHIPID) << 16) | (rr(REV) & 0xff)
              and mt76_chip() returns rev >> 16.
              """
              return self.rr(MT_HW_CHIPID) & 65535

          def hw_rev(self) -> int:
              return self.rr(MT_HW_REV)

      MT_HDR_FORMAT_CMD = 1

      MT_TX_TYPE_CMD = 2

      MT_TX_MCU_PORT_RX_Q0 = 32

      MT_TX_PORT_IDX_MCU = 1

      MT_TXD1_LONG_FORMAT = 1 << 31

      MT_TXD1_HDR_FORMAT_SHIFT = 16

      MCU_TXD1_CONNAC2 = MT_TXD1_LONG_FORMAT | MT_HDR_FORMAT_CMD << MT_TXD1_HDR_FORMAT_SHIFT

      MCU_PKT_ID = 160

      MCU_Q_QUERY, MCU_Q_SET, MCU_Q_RESERVED, MCU_Q_NA = (0, 1, 2, 3)

      MCU_S2D_H2N, MCU_S2D_C2N, MCU_S2D_H2C, MCU_S2D_H2CN = (0, 1, 2, 3)

      MCU_CMD_TARGET_ADDRESS_LEN_REQ = 1

      MCU_CMD_FW_START_REQ = 2

      MCU_CMD_NIC_POWER_CTRL = 4

      MCU_CMD_PATCH_SEM_CONTROL = 16

      MCU_CMD_FW_SCATTER = 238

      PATCH_SEM_RELEASE, PATCH_SEM_GET = (0, 1)

      PATCH_NOT_DL_SEM_FAIL, PATCH_IS_DL, PATCH_NOT_DL_SEM_SUCCESS, PATCH_REL_SEM_SUCCESS = (0, 1, 2, 3)

      DL_MODE_NEED_RSP = 1 << 31

      FW_START_OVERRIDE = 1 << 0

      MCU_TXD_LEN = 64

      MCU_RXD_LEN = 36

      RXD_SEQ_OFFSET = 29

      PKT_TYPE_RX_EVENT = 7

      PKT_TYPE_NORMAL = 2

      RXD0_PKT_FLAG_SHIFT, RXD0_PKT_FLAG_MASK = (16, 15)

      PKT_FLAG_NORMAL_MCU = 1

      RXD_STATUS_OFFSET = 32

      FW_SCATTER_MAX = 4096

      class McuError(RuntimeError):
          pass

      class Mt7921uMcu(Mt7921u):
          """Adds the MCU command/response layer on top of register access.

          The class attributes are the chip's MCU framing geometry. The defaults are the
          connac2 (MT7921) values; mt7925u overrides them for connac3.
          """
          TXD1 = MCU_TXD1_CONNAC2
          MCU_RXD_LEN = MCU_RXD_LEN
          RXD_SEQ_OFFSET = RXD_SEQ_OFFSET
          RXD_STATUS_OFFSET = RXD_STATUS_OFFSET

          def __init__(self, verbose: bool=False, usb_id: str | None=None, address: str | None=None):
              super().__init__(verbose=verbose, usb_id=usb_id, address=address)
              self.msg_seq = 0
              self.evt_ep4 = False
              self.mcu_wait_dropped_frames = 0
              self.mcu_wait_stale_events = 0
              self.mcu_wait_other_packets = 0

          def _next_seq(self) -> int:
              self.msg_seq = self.msg_seq + 1 & 15
              if self.msg_seq == 0:
                  self.msg_seq = self.msg_seq + 1 & 15
              return self.msg_seq

          def _build_mcu_txd(self, total_len: int, cid: int, seq: int, ext_cid: int=0, set_query: int=MCU_Q_NA, s2d: int=MCU_S2D_H2N) -> bytes:
              """mt76_connac2_mcu_fill_message, non-UNI path."""
              txd = [0] * 8
              txd[0] = total_len & 65535 | (MT_TX_TYPE_CMD & 3) << 23 | (MT_TX_MCU_PORT_RX_Q0 & 127) << 25
              txd[1] = self.TXD1
              out = b''.join((struct.pack('<I', v & 4294967295) for v in txd))
              pq_id = MT_TX_PORT_IDX_MCU << 15 | MT_TX_MCU_PORT_RX_Q0 << 10
              out += struct.pack('<HH', total_len - 32 & 65535, pq_id & 65535)
              out += struct.pack('<BBBB', cid & 255, MCU_PKT_ID, set_query & 255, seq & 255)
              out += struct.pack('<BBBB', 0, ext_cid & 255, s2d & 255, 1 if ext_cid else 0)
              out += b'\x00' * 20
              if len(out) != MCU_TXD_LEN:
                  raise RuntimeError(f'internal MCU TXD length {len(out)}, expected {MCU_TXD_LEN}')
              return out

          def mcu_send(self, cid: int, payload: bytes=b'', wait: bool=True, timeout: int=3000):
              """One MCU command. Returns the response body, or None if wait=False."""
              seq = self._next_seq()
              if cid == MCU_CMD_FW_SCATTER:
                  body = payload
                  ep = self.ep_out_ac_be
              else:
                  total = MCU_TXD_LEN + len(payload)
                  body = self._build_mcu_txd(total, cid, seq) + payload
                  ep = self.ep_out_inband_cmd
              hdr = struct.pack('<I', len(body) & 65535)
              frame = hdr + body
              pad = (len(frame) + 3 & ~3) + 4 - len(frame)
              frame += b'\x00' * pad
              if self.verbose:
                  print(f'    mcu -> cid=0x{cid:02x} seq={seq} payload={len(payload)}B frame={len(frame)}B ep=0x{ep:02x}')
              self.bulk_out(ep, frame, timeout)
              if not wait:
                  return None
              return self.mcu_wait(seq, cid, timeout)

          def mcu_wait(self, seq: int, cid: int, timeout: int=3000) -> bytes:
              """Read one MCU response and check its sequence.

              Which endpoint answers depends on MT_WFDMA_HOST_CONFIG_USB_RXEVT_EP4_EN:
              with it set (what mt792xu_dma_init does) responses arrive on
              MT_EP_IN_PKT_RX, otherwise on MT_EP_IN_CMD_RESP. Measured both ways.
              """
              ep = self.ep_in_pkt_rx if self.evt_ep4 else self.ep_in_cmd_resp
              deadline = time.monotonic() + timeout / 1000.0 * 4
              discarded = 0
              while time.monotonic() < deadline:
                  try:
                      raw = self.bulk_in(ep, 4096, timeout)
                  except usb.core.USBError as exc:
                      raise McuError(f'cid 0x{cid:02x} seq {seq}: no response on ep 0x{ep:02x} after {discarded} frames ({exc})') from exc
                  if len(raw) < self.MCU_RXD_LEN:
                      continue
                  rxd0 = struct.unpack_from('<I', raw, 0)[0]
                  pkt_type = rxd0 >> 27 & 31
                  pkt_flag = rxd0 >> RXD0_PKT_FLAG_SHIFT & RXD0_PKT_FLAG_MASK
                  is_frame = pkt_type == PKT_TYPE_NORMAL or (pkt_type == PKT_TYPE_RX_EVENT and pkt_flag == PKT_FLAG_NORMAL_MCU)
                  if is_frame or pkt_type != PKT_TYPE_RX_EVENT:
                      discarded += 1
                      if is_frame:
                          self.mcu_wait_dropped_frames += 1
                      else:
                          self.mcu_wait_other_packets += 1
                      continue
                  rseq = raw[self.RXD_SEQ_OFFSET]
                  if self.verbose:
                      print(f'    mcu <- {len(raw)}B seq={rseq} (want {seq}, {discarded} frames skipped)')
                  if rseq == seq:
                      return raw
                  discarded += 1
                  self.mcu_wait_stale_events += 1
              raise McuError(f'cid 0x{cid:02x}: no response matching seq {seq} ({discarded} frames skipped)')

          def _status_byte(self, rxd: bytes) -> int:
              """PATCH_SEM_CONTROL / PATCH_FINISH_REQ return a status byte."""
              return rxd[self.RXD_STATUS_OFFSET]

          def reply_body(self, rxd: bytes) -> bytes:
              """The payload after the chip's MCU reply header (skb_pull(sizeof(*rxd)))."""
              return rxd[self.MCU_RXD_LEN:]

          def patch_sem_ctrl(self, get: bool) -> int:
              op = PATCH_SEM_GET if get else PATCH_SEM_RELEASE
              rxd = self.mcu_send(MCU_CMD_PATCH_SEM_CONTROL, struct.pack('<I', op))
              return self._status_byte(rxd)

          def send_firmware(self, data: bytes, max_len: int=FW_SCATTER_MAX) -> None:
              off = 0
              while off < len(data):
                  n = min(max_len, len(data) - off)
                  self.mcu_send(MCU_CMD_FW_SCATTER, data[off:off + n], wait=False)
                  off += n

          def nic_power_ctrl(self, power_mode: int=1) -> None:
              """mt76_connac_mcu_restart. No response expected."""
              self.mcu_send(MCU_CMD_NIC_POWER_CTRL, struct.pack('<BBBB', power_mode, 0, 0, 0), wait=False)

      MT_TOP_MISC_FW_STATE = 7

      MT_UDMA_WLCFG_1 = MT_UMAC(12)

      MT_WL_RX_AGG_PKT_LMT = 255

      MT_WL_TX_TMOUT_LMT = 268435200

      MT_WL_RX_AGG_TO = 255

      MT_WL_RX_AGG_LMT = 65280

      MT_WL_TX_TMOUT_FUNC_EN = 1 << 16

      MT_WL_RX_MPSZ_PAD0 = 1 << 18

      MT_TICK_1US_EN = 1 << 20

      MT792X_USB_TX_TIMEOUT_LIMIT = 50000

      MT_WFDMA0_GLO_CFG_RX_DMA_BUSY = 1 << 3

      MT_WFDMA0_GLO_CFG_FW_DWLD_BYPASS_DMASHDL = 1 << 9

      MT_WFDMA0_GLO_CFG_OMIT_RX_INFO_PFET2 = 1 << 21

      MT_WFDMA0_GLO_CFG_OMIT_RX_INFO = 1 << 27

      MT_WFDMA0_GLO_CFG_OMIT_TX_INFO = 1 << 28

      MT_WPDMA0_MAX_CNT_MASK = 255

      MT_WPDMA0_BASE_PTR_MASK = 4294901760

      MT_WFDMA_DUMMY_CR = 1409286144 + 288

      MT_WFDMA_NEED_REINIT = 1 << 1

      MT_WFDMA_HOST_CONFIG = 2080534576

      MT_WFDMA_HOST_CONFIG_USB_RXEVT_EP4_EN = 1 << 6

      def MT_DMA_SHDL(ofs: int) -> int:
          return 2080530432 + ofs

      MT_DMASHDL_PAGE = MT_DMA_SHDL(12)

      MT_DMASHDL_GROUP_SEQ_ORDER = 1 << 16

      MT_DMASHDL_REFILL = MT_DMA_SHDL(16)

      MT_DMASHDL_REFILL_MASK = 4294901760

      MT_DMASHDL_PKT_MAX_SIZE = MT_DMA_SHDL(28)

      MT_DMASHDL_PKT_MAX_SIZE_PLE = 4095

      MT_DMASHDL_PKT_MAX_SIZE_PSE = 268369920

      def MT_DMASHDL_GROUP_QUOTA(n: int) -> int:
          return MT_DMA_SHDL(32 + (n << 2))

      def MT_DMASHDL_Q_MAP(n: int) -> int:
          return MT_DMA_SHDL(96 + (n << 2))

      def MT_DMASHDL_SCHED_SET(n: int) -> int:
          return MT_DMA_SHDL(112 + (n << 2))

      def MT_UWFDMA0_TX_RING_EXT_CTRL(n: int) -> int:
          return MT_UWFDMA0(1536 + (n << 2))

      class Mt7921uDevice(Mt7921uMcu):
          """Full bring-up through firmware download."""

          def dma_prefetch(self) -> None:
              for idx, cnt, base in ((0, 4, 128), (1, 4, 192), (2, 4, 256), (3, 4, 320), (4, 4, 384), (16, 4, 640), (17, 4, 704)):
                  self.rmw(MT_UWFDMA0_TX_RING_EXT_CTRL(idx), MT_WPDMA0_MAX_CNT_MASK | MT_WPDMA0_BASE_PTR_MASK, cnt & 255 | base << 16 & MT_WPDMA0_BASE_PTR_MASK)

          def wfdma_init(self) -> None:
              """mt792xu_wfdma_init."""
              self.dma_prefetch()
              self.clear_bits(MT_UWFDMA0_GLO_CFG, MT_WFDMA0_GLO_CFG_OMIT_RX_INFO)
              self.set_bits(MT_UWFDMA0_GLO_CFG, MT_WFDMA0_GLO_CFG_OMIT_TX_INFO | MT_WFDMA0_GLO_CFG_OMIT_RX_INFO_PFET2 | MT_WFDMA0_GLO_CFG_FW_DWLD_BYPASS_DMASHDL | MT_WFDMA0_GLO_CFG_TX_DMA_EN | MT_WFDMA0_GLO_CFG_RX_DMA_EN)
              self.rmw(MT_DMASHDL_REFILL, MT_DMASHDL_REFILL_MASK, 4292870144)
              self.clear_bits(MT_DMASHDL_PAGE, MT_DMASHDL_GROUP_SEQ_ORDER)
              self.rmw(MT_DMASHDL_PKT_MAX_SIZE, MT_DMASHDL_PKT_MAX_SIZE_PLE | MT_DMASHDL_PKT_MAX_SIZE_PSE, 1)
              for i in range(5):
                  self.wr(MT_DMASHDL_GROUP_QUOTA(i), 3 | 4095 << 16)
              for i in range(5, 16):
                  self.wr(MT_DMASHDL_GROUP_QUOTA(i), 0)
              self.wr(MT_DMASHDL_Q_MAP(0), 838939137)
              self.wr(MT_DMASHDL_Q_MAP(1), 838939137)
              self.wr(MT_DMASHDL_Q_MAP(2), 1431655492)
              self.wr(MT_DMASHDL_Q_MAP(3), 1431655492)
              self.wr(MT_DMASHDL_SCHED_SET(0), 1985216818)
              self.wr(MT_DMASHDL_SCHED_SET(1), 4275878552)
              self.set_bits(MT_WFDMA_DUMMY_CR, MT_WFDMA_NEED_REINIT)

          def dma_rx_evt_ep4(self) -> None:
              """mt792xu_dma_rx_evt_ep4: route RX events to endpoint 4."""
              if not self.poll(MT_UWFDMA0_GLO_CFG, MT_WFDMA0_GLO_CFG_RX_DMA_BUSY, 0, 1000):
                  raise RuntimeError('timeout waiting for RX DMA idle')
              self.clear_bits(MT_UWFDMA0_GLO_CFG, MT_WFDMA0_GLO_CFG_RX_DMA_EN)
              self.set_bits(MT_WFDMA_HOST_CONFIG, MT_WFDMA_HOST_CONFIG_USB_RXEVT_EP4_EN)
              self.set_bits(MT_UWFDMA0_GLO_CFG, MT_WFDMA0_GLO_CFG_RX_DMA_EN)
              self.evt_ep4 = True

          def epctl_rst_opt(self, reset: bool) -> None:
              """mt792xu_epctl_rst_opt."""
              mask = 1008 | 7340032
              val = self.uhw_rr(MT_SSUSB_EPCTL_CSR_EP_RST_OPT)
              val = val | mask if reset else val & ~mask & 4294967295
              self.uhw_wr(MT_SSUSB_EPCTL_CSR_EP_RST_OPT, val)

          def dma_init(self, resume: bool=False) -> None:
              """mt792xu_dma_init."""
              self.wfdma_init()
              self.clear_bits(MT_UDMA_WLCFG_0, MT_WL_RX_FLUSH)
              self.set_bits(MT_UDMA_WLCFG_0, MT_WL_RX_EN | MT_WL_TX_EN | MT_WL_RX_MPSZ_PAD0 | MT_TICK_1US_EN)
              self.rmw(MT_UDMA_WLCFG_1, MT_WL_TX_TMOUT_LMT, MT792X_USB_TX_TIMEOUT_LIMIT << 8 & MT_WL_TX_TMOUT_LMT)
              self.set_bits(MT_UDMA_WLCFG_0, MT_WL_TX_TMOUT_FUNC_EN)
              self.clear_bits(MT_UDMA_WLCFG_0, MT_WL_RX_AGG_TO | MT_WL_RX_AGG_LMT)
              self.clear_bits(MT_UDMA_WLCFG_1, MT_WL_RX_AGG_PKT_LMT)
              if resume:
                  return
              self.dma_rx_evt_ep4()
              self.epctl_rst_opt(False)

      MT_CBTOP_RGU_WF_SUBSYS_RST = 1879056384 + 1536

      MT_CBTOP_RGU_WF_SUBSYS_RST_WF_WHOLE_PATH = 1 << 0

      MT_UDMA_CONN_INFRA_STATUS_SEL = MT_UMAC(2596)

      MT_WL_RX_BUSY = 1 << 30

      MT_WL_TX_BUSY = 1 << 31

      MT792x_WFSYS_INIT_RETRY_COUNT = 2

      MT792X_USB_UDMA_IDLE_TIMEOUT = 1000

      def _wait_udma_idle(self) -> None:
          """mt792xu_wait_udma_idle."""
          self.set_bits(MT_UDMA_WLCFG_0, MT_WL_RX_FLUSH)
          if not self.poll(MT_UDMA_WLCFG_0, MT_WL_RX_BUSY | MT_WL_TX_BUSY, 0, MT792X_USB_UDMA_IDLE_TIMEOUT):
              val = self.rr(MT_UDMA_WLCFG_0)
              print(f'  warning: UDMA busy before WFSYS reset, WLCFG0=0x{val:08x}')

      def _wfsys_reset(self) -> None:
          """mt792xu_wfsys_reset, driven by the class's WFSYS_* descriptor
          (struct mt792xu_wfsys_desc; mt7921_wfsys_desc is the default below).

          Note the reset register is reached through the UHW (USB host wrapper)
          vendor request pair, not the normal one.
          """
          self.wait_udma_idle()
          self.epctl_rst_opt(False)
          val = self.uhw_rr(self.WFSYS_RST_REG)
          self.uhw_wr(self.WFSYS_RST_REG, val | MT_CBTOP_RGU_WF_SUBSYS_RST_WF_WHOLE_PATH)
          time.sleep(self.WFSYS_RST_DELAY_S)
          val = self.uhw_rr(self.WFSYS_RST_REG)
          self.uhw_wr(self.WFSYS_RST_REG, val & ~MT_CBTOP_RGU_WF_SUBSYS_RST_WF_WHOLE_PATH & 4294967295)
          if self.WFSYS_NEED_STATUS_SEL:
              self.uhw_wr(MT_UDMA_CONN_INFRA_STATUS_SEL, 0)
          for _ in range(MT792x_WFSYS_INIT_RETRY_COUNT):
              val = self.uhw_rr(self.WFSYS_DONE_REG)
              if val & self.WFSYS_DONE_MASK == self.WFSYS_DONE_VAL:
                  return
              time.sleep(0.1)
          raise RuntimeError('timeout waiting for WFSYS init done')

      Mt7921uDevice.WFSYS_RST_REG = MT_CBTOP_RGU_WF_SUBSYS_RST

      Mt7921uDevice.WFSYS_DONE_REG = MT_UDMA_CONN_INFRA_STATUS

      Mt7921uDevice.WFSYS_DONE_MASK = MT_UDMA_CONN_WFSYS_INIT_DONE

      Mt7921uDevice.WFSYS_DONE_VAL = MT_UDMA_CONN_WFSYS_INIT_DONE

      Mt7921uDevice.WFSYS_RST_DELAY_S = 0.001

      Mt7921uDevice.WFSYS_NEED_STATUS_SEL = True

      Mt7921uDevice.wait_udma_idle = _wait_udma_idle

      Mt7921uDevice.wfsys_reset = _wfsys_reset

      MT_SWDEF_MODE = 4321792 + 60

      MT_SWDEF_NORMAL_MODE = 0

      ENTRY = 9523200

      MAILBOX = 33784672

      BOOT_MAGIC = int.from_bytes(b'BRIA', 'little')

      RESPONSE_XOR = 2977372765

      MAX_CODE = 4096

      DMA_DEFINITIONS = dict(RING=33816576, HEADERS=33816832, PAYLOAD=33820672, SLOT_STRIDE=12288, RING_COUNT=4, PAYLOAD_BYTES=8192)

      FORMATS = dict(bootstrap='birriasdr-boot-probe-v1', usb_dma='birriasdr-usb-dma-v1', radio_boot='birriasdr-radio-boot-probe-v1', radio_init='birriasdr-radio-init-probe-v1', radio_steps='birriasdr-radio-steps-v1', iq_snapshot='birriasdr-iq-snapshot-v1', iq_stream='birriasdr-iq-stream-v1')

      ROM_HELPERS = dict(radio_boot=[8614210], radio_init=[8614210, 8637452], radio_steps=[8614210, 8635040, 8633792, 8633396, 8637150, 8633276, 8635768, 8671278, 8443826, 8418224, 8418286], iq_snapshot=[8614210], iq_stream=[8614210])

      DMA_PROGRAMS = ('usb_dma', 'iq_snapshot', 'iq_stream')

      def pda_checksum(data):
          """Measured PDA LFSR; see evidence/download-crc-reset-word8.json."""
          if len(data) % 4:
              raise ValueError('PDA data must contain whole 32-bit words')
          state = 0
          for word, in struct.iter_unpack('<I', data):
              parity = (state & 278008081).bit_count() & 1
              state = state >> 1 ^ parity << 31 ^ word
          return state

      def download_image(code):
          if not code or len(code) > MAX_CODE or len(code) % 2:
              raise ValueError('Bootstrap must contain 1..4096 bytes of NDS32 instructions')
          image = code + bytes(-len(code) % 16) + bytes(16)
          correction = pda_checksum(image)
          image = image[:-4] + struct.pack('<I', correction)
          if pda_checksum(image):
              raise ValueError('Internal PDA checksum failure')
          return image

      def verify_image(image, manifest):
          if manifest.get('format') not in FORMATS.values():
              raise ValueError('Unsupported bootstrap manifest')
          if manifest['format'] in tuple((FORMATS[p] for p in DMA_PROGRAMS)) and manifest.get('dma') != DMA_DEFINITIONS:
              raise ValueError('Unexpected DMA memory layout')
          for program, helpers in ROM_HELPERS.items():
              if manifest['format'] == FORMATS[program] and manifest.get('rom_helpers') != helpers:
                  raise ValueError('Unexpected radio ROM helpers')
          for name, expected in (('entry', ENTRY), ('mailbox', MAILBOX), ('magic', BOOT_MAGIC), ('response_xor', RESPONSE_XOR)):
              if manifest.get(name) != expected:
                  raise ValueError('Unexpected bootstrap ' + name)
          length = manifest.get('code_bytes')
          if type(length) is not int or not 0 < length <= MAX_CODE:
              raise ValueError('Invalid bootstrap code size')
          if manifest.get('download_bytes') != len(image):
              raise ValueError('Bootstrap download size mismatch')
          if hashlib.sha256(image).hexdigest() != manifest.get('sha256'):
              raise ValueError('Bootstrap hash mismatch')
          if download_image(image[:length]) != image:
              raise ValueError('Bootstrap trailer/checksum mismatch')

      def status_command(dev, protocol, command, payload, report, name):
          reply = dev.mcu_send(command, payload)
          if not isinstance(reply, bytes) or len(reply) <= RXD_STATUS_OFFSET:
              raise RuntimeError(name + ': truncated ROM response')
          status = reply[RXD_STATUS_OFFSET]
          report[name] = dict(status=status, reply=reply.hex())
          if status:
              raise RuntimeError(f'{name}: ROM rejected command (status {status})')

      def prepare_download(dev, protocol, image, manifest, report, nonce=None):
          """Download only our image; leave starting it and reading USB to the caller."""
          verify_image(image, manifest)
          nonce = secrets.randbits(32) if nonce is None else nonce
          if type(nonce) is not int or not 0 <= nonce <= 4294967295:
              raise ValueError('Challenge must be an unsigned 32-bit integer')
          report.update(custom_entry_executed=False, vendor_firmware_bytes_sent=0, sha256=manifest['sha256'], challenge=nonce, phase='reset')
          dev.wfsys_reset()
          dev.power_on()
          dev.dma_init(resume=False)
          dev.wr(MT_SWDEF_MODE, MT_SWDEF_NORMAL_MODE)
          dev.set_bits(MT_UDMA_TX_QSEL, MT_FW_DL_EN)
          dev.nic_power_ctrl(1)
          if not dev.poll(MT_CONN_ON_MISC, MT_TOP_MISC_FW_STATE, MT_TOP_MISC2_FW_PWR_ON, 1000):
              raise RuntimeError('MCU did not enter ROM download state')
          report['phase'] = 'check_unpatched_rom'
          sem = dev.patch_sem_ctrl(True)
          report['patch_semaphore'] = sem
          if sem != PATCH_NOT_DL_SEM_SUCCESS:
              raise RuntimeError(f'Need an unpatched ROM (semaphore {sem}); cold-power-cycle the dongle')
          release = dev.patch_sem_ctrl(False)
          if release != PATCH_REL_SEM_SUCCESS:
              raise RuntimeError(f'ROM semaphore release failed ({release})')
          report['phase'] = 'mailbox'
          initial = [0, nonce, 0, 0, 0, 0, 0, 0]
          for i, word in enumerate(initial):
              dev.wr(MAILBOX + 4 * i, word)
          if [dev.rr(MAILBOX + 4 * i) for i in range(8)] != initial:
              raise RuntimeError('Cannot establish a fresh DLM mailbox')
          report['phase'] = 'download'
          dev.wr(1409288200, 2147483648)
          status_command(dev, protocol, MCU_CMD_TARGET_ADDRESS_LEN_REQ, struct.pack('<III', ENTRY, len(image), DL_MODE_NEED_RSP), report, 'download_reply')
          dev.send_firmware(image)
          time.sleep(0.01)
          report['pda_status'] = dev.rr(1409288200)
          report['pda_checksum'] = dev.rr(1409288212)
          if report['pda_status'] != 37 or report['pda_checksum'] != 0:
              raise RuntimeError('Custom image did not finish with the expected PDA status/checksum')
          return nonce

      @contextmanager
      def exclusive_device(protocol, usb, report, prepare=None):
          """Userland ownership, with no automatic vendor boot on entry or cleanup."""
          with open('/tmp/sdr-wifi-3574-6211.lock', 'a') as lock:
              fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
              if prepare is not None:
                  prepare(report)
              candidates = [d for d in usb.core.find(find_all=True) if (d.idVendor, d.idProduct) in SUPPORTED_DEVICES]
              if len(candidates) != 1:
                  raise RuntimeError(f'Expected one 3574:6211 or 0e8d:7961 dongle; found {len(candidates)}')
              raw = candidates[0]
              usb_id = f'{raw.idVendor:04x}:{raw.idProduct:04x}'
              if usb_id != '3574:6211':
                  # Same per-port lock as libbirriasdr, so birria_rx cannot open it concurrently.
                  board_lock = open(f'/tmp/birriasdr-{raw.bus}-{raw.address}.lock', 'a')
                  fcntl.flock(board_lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
              layout = layout_from_pyusb(raw)
              topology = f'{raw.bus}-' + '.'.join(map(str, raw.port_numbers))
              for net in Path('/sys/class/net').glob('*'):
                  device = net / 'device'
                  if device.exists() and device.resolve().name.split(':')[0] == topology:
                      if (net / 'operstate').read_text().strip() == 'up':
                          raise RuntimeError(f'{net.name} is in use')
              dev = Mt7921uDevice(usb_id=usb_id, address=device_address(raw))
              opened = False
              detached = False
              try:
                  try:
                      active = raw.is_kernel_driver_active(layout.interface)
                  except NotImplementedError:
                      if sys.platform != 'darwin':
                          raise
                      active = False
                  if active:
                      if sys.platform == 'darwin':
                          raise RuntimeError('Release the active macOS driver before using libusb')
                      raw.detach_kernel_driver(layout.interface)
                      detached = True
                  dev.open()
                  opened = True
                  report['usb'] = dict(bus=raw.bus, address=raw.address, topology=topology, kernel_driver_detached=detached)
                  yield dev
              finally:
                  if opened:
                      try:
                          dev.wfsys_reset()
                          report['cleanup_reset'] = True
                      except Exception as exc:
                          report['cleanup_reset'] = False
                          report['cleanup_error'] = str(exc)
                      finally:
                          dev.close()
                  report['kernel_driver_left_detached'] = detached
                  usb.util.dispose_resources(raw)

      def read(dev, address, size):
          data = bytearray()
          for offset in range(0, size, 64):
              addr = address + offset
              count = min(64, size - offset)
              part = bytes(dev.dev.ctrl_transfer(192, 99, addr >> 16, addr & 65535, count, timeout=1000))
              if len(part) != count:
                  raise RuntimeError(f'Short read at {addr:#x}')
              data.extend(part)
          return bytes(data)

      class RFSPI:
          BASE = 2080391168
          PORTS = {0: (16, 1), 1: (16, 1), 5: (80, 5), 6: (16, 1), 7: (16, 1)}

          def __init__(self, dev, timeout=0.1):
              if timeout <= 0:
                  raise ValueError('SPI timeout must be positive')
              self.dev = dev
              self.timeout = timeout

          def _read32(self, address):
              data = bytes(self.dev.dev.ctrl_transfer(192, 99, address >> 16, address & 65535, 4, timeout=1000))
              if len(data) != 4:
                  raise RuntimeError(f'Short RF bridge read at {address:#x}')
              return struct.unpack('<I', data)[0]

          def _write32(self, address, value):
              count = self.dev.dev.ctrl_transfer(64, 102, address >> 16, address & 65535, struct.pack('<I', value), timeout=1000)
              if count != 4:
                  raise RuntimeError(f'Short RF bridge write at {address:#x}')

          def _idle(self, bit):
              deadline = time.monotonic() + self.timeout
              while self._read32(self.BASE) & 1 << bit:
                  if time.monotonic() >= deadline:
                      raise TimeoutError(f'RF SPI busy bit {bit} did not clear')

          def _transfer(self, port, address, value=None):
              if port not in self.PORTS or not 0 <= address <= 4095 or address % 4:
                  raise ValueError('Expected a Wi-Fi/TOP port and aligned 12-bit RF address')
              if value is not None and (not 0 <= value <= 4294967295):
                  raise ValueError('RF value must be uint32')
              offset, bit = self.PORTS[port]
              command = self.BASE + offset
              self._idle(bit)
              control = self._read32(command) & 4294901760
              control |= port << 13 | address | (4096 if value is None else 0)
              self._write32(command, control)
              self._write32(command + 4, 0 if value is None else value)
              self._idle(bit)
              return self._read32(command + 8) if value is None else None

          def read(self, port, address):
              return self._transfer(port, address)

          def write(self, port, address, value):
              self._transfer(port, address, value)

          def update(self, port, address, clear=0, set_=0):
              value = self.read(port, address) & ~clear | set_
              self.write(port, address, value)
              return value

      def prepare_2g_synth(spi, port=1, reference_khz=60000):
          """Experimental synthesizer bias, divider and calibration settings.

          These address/value facts are decoded for the 2.4 GHz path. They are not
          a complete RF initialization and have not established an antenna response.
          """
          if port not in (0, 1) or reference_khz not in (50000, 60000):
              raise ValueError('Unsupported synthesizer port/reference')
          for address, value in ((3080, 1073864704), (3088, 73536), (3100, 3493865736), (3104, 101188104), (3280, 65558), (3300, 194807653), (3304, 11), (3308, 657862), (3072, 2424872), (3156, 530452), (3168, 533512), (3172, 1610612736), (3184, 54931473), (3272, 2018148651), (3328, 1048576), (3332, 860112213), (3336, 1449542741), (3340, 1719109785), (3344, 14887), (3192, 226174), (3220, 530452), (3232, 533512), (3236, 1610612736), (3248, 54931473), (3256, 226174)):
              spi.write(port, address, value)
          if reference_khz == 50000:
              for address, value in ((3072, 2424876), (3172, 1610612752), (3236, 1610612752), (3332, 2864430284), (3336, 3722357435), (3340, 3167542750), (3344, 44718)):
                  spi.write(port, address, value)

      def tune_2g(spi, frequency_khz, report, port=1, reference_khz=60000, secondary=False):
          """Research a selected synthesizer; the complete RX setup is still missing."""
          if frequency_khz not in range(2412000, 2472001, 5000):
              raise ValueError('This probe supports 2.4 GHz channels 1..13 only')
          if port not in (0, 1) or reference_khz not in (50000, 60000):
              raise ValueError('Unsupported synthesizer port/reference')
          if spi.read(5, 44) != 2037549584:
              raise RuntimeError('Expected the tested MT7972 analog die')

          def update(address, clear=0, set_=0):
              return spi.update(port, address, clear, set_)

          def write(address, value):
              spi.write(port, address, value)
          vco_khz = 2 * frequency_khz
          integer, remainder = divmod(vco_khz, reference_khz)
          fraction = ((remainder << 18) + reference_khz // 2) // reference_khz
          frequency_word = 2147483648 | integer << 20 | fraction << 2
          calibration_cycles = vco_khz * 240 // reference_khz - 2
          frequency_reg = 3240 if secondary else 3176
          selector = 3 if secondary else 2
          calibration_byte = 24 if reference_khz == 50000 else 20
          report.update(requested_frequency_khz=frequency_khz, pll_frequency_word=hex(frequency_word), pll_calibration_cycles=calibration_cycles, pll_spi_port=port, pll_reference_khz=reference_khz, pll_secondary=secondary, pll_calibration_complete=False, rf_reception_validated=False)
          update(576, set_=4026531840)
          update(516, 12582912, selector << 22)
          update(540, 393216, selector << 17)
          update(352, 1 << 29)
          write(3320, 144)
          write(frequency_reg, frequency_word)
          write(frequency_reg + 4, calibration_cycles)
          update(frequency_reg + 16, 1048560, calibration_byte * 4112)
          try:
              update(3360, 4)
              update(3268, set_=1 << 30)
              write(3296, 1117086835)
              update(3272, set_=1)
              update(3268, set_=1 << 29)
              deadline = time.monotonic() + 0.1
              while True:
                  value = spi.read(port, 3452)
                  report['pll_status'] = hex(value)
                  if value & 1 << 21:
                      report['pll_calibration_complete'] = True
                      break
                  if time.monotonic() >= deadline:
                      raise TimeoutError('MT7972 synthesizer calibration did not complete')
              update(3268, 1 << 29)
              update(3268, 1 << 30)
              result = spi.read(port, 3448)
              report['pll_calibration_result'] = hex(result)
              update(3084, 7 << 22, (result & 7) << 22)
              report['pll_status_latched'] = hex(spi.read(port, 3452))
          finally:
              update(3268, 1 << 29 | 1 << 30)
              update(3272, 1)
              update(3360, set_=4)
              write(3296, 0)
          report['pll_frequency_readback'] = hex(spi.read(port, frequency_reg))
          report['pll_range_status'] = hex(spi.read(port, 3440))
          if spi.read(port, frequency_reg) != frequency_word & 2147483647:
              raise RuntimeError('Synthesizer frequency field did not retain its value')

      def configure_chain_bias(spi, port):
          """Apply the decoded common bias fields to one Wi-Fi SPI port."""
          if port not in (0, 1):
              raise ValueError('Expected Wi-Fi SPI port 0 or 1')
          prepare_2g_synth(spi, port=port)
          for address, value in ((3192, 226174), (0, 1667244880), (24, 2097152), (8, 55574536), (292, 346836800), (288, 64065522), (184, 1934606588), (180, 909529072), (188, 685518911), (228, 5340158), (112, 3833593856), (120, 532628624), (176, 4289236736), (244, 1095696389), (200, 3200), (96, 4708988), (152, 4044409856), (64, 55615368), (72, 313504), (88, 6292313), (368, 1), (56, 1073745328), (132, 2406494208), (192, 3048153088), (60, 268935765)):
              spi.write(port, address, value)

      def configure_receiver(dev, report, frequency_khz=2437000):
          if frequency_khz not in range(2412000, 2472001, 5000):
              raise ValueError('Expected a 2.4 GHz channel 1..13')
          spi = RFSPI(dev)
          if spi.read(5, 44) != 2037549584:
              raise RuntimeError('Expected the tested MT7972 analog die')
          if dev.rr(33572352) != 40000000:
              raise RuntimeError('Expected 40 MHz crystal reference')
          addresses = (52, 68, 72, 836, 884, 2992, 2820, 3000, 2824, 2720)
          report['top_before'] = {hex(a): hex(spi.read(5, a)) for a in addresses}
          for address, value in ((68, 1177420116), (72, 103678292), (836, 10477704), (884, 10477704), (52, 3221786080), (2992, 1126634529)):
              spi.write(5, address, value)
          spi.update(5, 2820, 256)
          time.sleep(2e-05)
          spi.update(5, 2820, set_=256)
          time.sleep(2e-05)
          spi.update(5, 2820, 256)
          spi.write(5, 3000, 3402419404)
          spi.write(5, 2824, 2048)
          for address, value in ((828, 97), (800, 98), (876, 97), (848, 98)):
              spi.update(5, address, 4095, value)
          clock_regs = (1879048520, 1879048448, 1879048456, 1879060480, 1879060500, 1879068672, 1879068680, 1879068684, 1879113740)
          report['digital_before'] = {hex(a): hex(dev.rr(a)) for a in clock_regs}
          dev.rmw(1879048520, 0, 16)
          deadline = time.monotonic() + 0.1
          while not dev.rr(1879048520) & 128:
