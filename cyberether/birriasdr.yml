      m = None  # Flattened protocol functions use ordinary global constants below.

      # CyberEther 1.10 supplies editor source through its loader, without __file__.
      # Reuse that plain script in a USB worker running the SAME Python interpreter.
      _script_path = globals().get('__file__')
      _script_text = None
